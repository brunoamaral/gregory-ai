[project]
name = "gregory-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing the GregoryAI REST API to LLM clients"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.0.0",
    # gregory_mcp/server.py imports directly from mcp_types (ToolAnnotations) —
    # pinned explicitly rather than relying on it only being pulled in
    # transitively via mcp's own dependency on it.
    "mcp-types==2.0.0",
    "httpx2>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Put the rootdir on sys.path. tests/test_client.py and
# tests/test_no_internal_url_leak.py import `tests.conftest` absolutely, and
# tests/ is not a package, so bare `pytest` cannot resolve it — only
# `python -m pytest` worked, because that form prepends the CWD. Without this
# the documented `pytest` invocation fails at collection.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gregory_mcp*"]
