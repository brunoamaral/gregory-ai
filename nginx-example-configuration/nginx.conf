        gzip_types      text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    }

    # subdomains redirect
    server {
        listen                  443 ssl http2;
        listen                  [::]:443 ssl http2;
        server_name             *.api.DOMAIN.ORG;

        # SSL
        ssl_certificate         /etc/letsencrypt/live/api.DOMAIN.ORG/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/api.DOMAIN.ORG/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/api.DOMAIN.ORG/chain.pem;
        return                  301 https://api.DOMAIN.ORG$request_uri;
    }

    # gregory-ai.DOMAIN.ORG — dedicated host for gregory-mcp, the MCP server (see
    # docs/07-mcp-server.md): /mcp is read-only and unauthenticated, /mcp/editor
    # needs a sign-in (OAuth, served by api.DOMAIN.ORG). It gets its own host
    # rather than a `location` under api.DOMAIN.ORG so it can carry its own
    # error/access logs and a catch-all 404 without touching the API's server
    # block. Needs its own DNS record and certificate — see docs/07-mcp-server.md
    # "Deployment" for the one-time DNS/certbot step.
    #
    # The map/limit_req_zone/log_format directives referenced below (near the top
    # of this file) are http-context and can't live in this server block; in
    # production they live in a separate conf.d/mcp.conf, included into the http
    # context, while this server block lives in its own sites-enabled file.
    server {
        listen                               443 ssl http2;
        listen                               [::]:443 ssl http2;
        server_name                          gregory-ai.DOMAIN.ORG;

        # SSL
        ssl_certificate                      /etc/letsencrypt/live/gregory-ai.DOMAIN.ORG/fullchain.pem;
        ssl_certificate_key                  /etc/letsencrypt/live/gregory-ai.DOMAIN.ORG/privkey.pem;
        ssl_trusted_certificate              /etc/letsencrypt/live/gregory-ai.DOMAIN.ORG/chain.pem;

        # security headers
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy   "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
        add_header Permissions-Policy        "interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # . files
        location ~ /\.(?!well-known) {
            deny all;
        }

        # logging — server level, so the catch-all 404 below lands here too.
        # See docs/07-mcp-server.md ("Auth") for why that's useful, not a bug,
        # and how to filter it out when it isn't wanted.
        access_log                           /var/log/nginx/mcp-access.log mcp_combined;
        error_log                            /var/log/nginx/mcp-error.log warn;

        # No trailing slash, and proxy_pass carries no path — both matter. The
        # app is mounted at /mcp and 307-redirects /mcp/ -> /mcp, so a
        # `location /mcp/` block would route the redirect target nowhere (it
        # falls through to `location /` below and 404s). A prefix match on
        # /mcp catches both spellings, and a pathless proxy_pass preserves the
        # original URI instead of rewriting it. Verified in production
        # 2026-08-05.
        location /mcp {
            # nginx's own default for a throttled request is 503, which reads as
            # "server broken" rather than "you're going too fast" — 429 is the
            # correct status for a client to act on (back off and retry).
            limit_req_status                   429;
            limit_req                          zone=mcp_per_tool burst=10 nodelay;
            limit_req                          zone=mcp_per_client burst=40 nodelay;

            proxy_pass                         http://127.0.0.1:8001;
            proxy_http_version                 1.1;
            proxy_buffering                    off;
            # This host serves nothing but /mcp, so there is no shared cache to
            # bypass selectively — turn caching off outright rather than
            # conditioning it on $http_upgrade.
            proxy_cache                        off;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Forwarded         $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout              10s;
            proxy_send_timeout                 300s;
            # An idle SSE stream (client connected, waiting on the next server
            # message mid-conversation) can go quiet for longer than a typical
            # REST request without being dead — 60s was cutting those off.
            proxy_read_timeout                 300s;
        }

        # The editor address. A longer prefix than `location /mcp` above, so it
        # wins for /mcp/editor and anything below it; the anonymous location is
        # untouched. The Authorization header (the user's bearer token) passes
        # through to gregory-mcp, which checks it; nginx neither reads nor logs
        # it (mcp_combined has no header fields besides Mcp-Name / Mcp-Method).
        # One such location is needed on EVERY site's gregory-ai.<site domain>
        # server block, because each site's editor address is on its own host.
        location /mcp/editor {
            limit_req_status                   429;
            limit_req                          zone=mcp_editor_per_client burst=40 nodelay;

            proxy_pass                         http://127.0.0.1:8001;
            proxy_http_version                 1.1;
            proxy_buffering                    off;
            proxy_cache                        off;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Forwarded         $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout              10s;
            proxy_send_timeout                 300s;
            proxy_read_timeout                 300s;
        }

        # RFC 9728 protected resource metadata for the editor address: the
        # document an MCP client fetches after a 401 to find the authorization
        # server. Served by gregory-mcp per Host, so it must be proxied on this
        # host (the catch-all below would 404 it). Exact match, public, and
        # rate-limited with the editor zone. The authorization server's own
        # metadata is on api.DOMAIN.ORG, not here.
        location = /.well-known/oauth-protected-resource/mcp/editor {
            limit_req_status                   429;
            limit_req                          zone=mcp_editor_per_client burst=40 nodelay;

            proxy_pass                         http://127.0.0.1:8001;
            proxy_http_version                 1.1;
            proxy_cache                        off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout              10s;
            proxy_read_timeout                 30s;
        }

        # catch-all — this host serves nothing but /mcp, /mcp/editor and the
        # one well-known document above.
        location / {
            return 404;
        }

        # favicon.ico
        location = /favicon.ico {
            log_not_found off;
            access_log    off;
        }

        # robots.txt
        location = /robots.txt {
            log_not_found off;
            access_log    off;
        }
    }

    # HTTP redirect
    server {
        listen      80;
        listen      [::]:80;
        server_name .gregory-ai.DOMAIN.ORG;

        # ACME-challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/_letsencrypt;
        }

        location / {
            return 301 https://gregory-ai.DOMAIN.ORG$request_uri;
        }
    }

    # HTTP redirect
    server {
        listen      80;
        listen      [::]:80;
        server_name .admin.DOMAIN.ORG;

        # ACME-challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/_letsencrypt;
        }

        location / {
            return 301 https://admin.DOMAIN.ORG$request_uri;
        }
    }

    # metabase.DOMAIN.ORG
    server {
        listen                               443 ssl http2;
        listen                               [::]:443 ssl http2;
        server_name                          metabase.DOMAIN.ORG;
        root                                 /var/www/metabase.DOMAIN.ORG/public;

        # SSL
        ssl_certificate                      /etc/letsencrypt/live/metabase.DOMAIN.ORG/fullchain.pem;
        ssl_certificate_key                  /etc/letsencrypt/live/metabase.DOMAIN.ORG/privkey.pem;
        ssl_trusted_certificate              /etc/letsencrypt/live/metabase.DOMAIN.ORG/chain.pem;

        # security headers
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy   "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
        add_header Permissions-Policy        "interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # . files
        location ~ /\.(?!well-known) {
            deny all;
        }

        # index.php
        index index.php;

        # reverse proxy
        location / {
            proxy_pass                         http://127.0.0.1:3000;
            proxy_http_version                 1.1;
            proxy_cache_bypass                 $http_upgrade;

            # Proxy headers
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Forwarded         $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # Proxy timeouts
            proxy_connect_timeout              60s;
            proxy_send_timeout                 60s;
            proxy_read_timeout                 60s;
        }

        # favicon.ico
        location = /favicon.ico {
            log_not_found off;
            access_log    off;
        }

        # robots.txt
        location = /robots.txt {
            log_not_found off;
            access_log    off;
        }

        # gzip
        gzip            on;
        gzip_vary       on;
        gzip_proxied    any;
        gzip_comp_level 6;
        gzip_types      text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    }

    # subdomains redirect
    server {
        listen                  443 ssl http2;
        listen                  [::]:443 ssl http2;
        server_name             *.metabase.DOMAIN.ORG;

        # SSL
        ssl_certificate         /etc/letsencrypt/live/metabase.DOMAIN.ORG/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/metabase.DOMAIN.ORG/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/metabase.DOMAIN.ORG/chain.pem;
        return                  301 https://metabase.DOMAIN.ORG$request_uri;
    }

    # HTTP redirect
    server {
        listen      80;
        listen      [::]:80;
        server_name .metabase.DOMAIN.ORG;

        # ACME-challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/_letsencrypt;
        }

        location / {
            return 301 https://metabase.DOMAIN.ORG$request_uri;
        }
    }
}