services:
  db:
    image: postgres:17
    restart: always
    container_name: db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - gregory_network

  gregory:
    container_name: gregory
    restart: always
    image: amaralbruno/gregory-ai:latest
    build: .
    volumes:
      - ./django/media:/code/media                  # user uploads (persist)
      - ./django/models:/code/models                # trained ML models (persist, ml-ship rsyncs into it)
      - ./django/datasets:/code/datasets            # training data exports (ml-export reads them over SSH)
      - ./django/summary_cache:/code/summary_cache  # LLM summary cache (persist)
      - ./django/static:/code/static                # collectstatic output (host nginx reads it)
      - ./django/backups:/code/backups              # CTIS /retrieve JSON snapshots (persist)
    ports:
      - 127.0.0.1:8000:8000
    environment:
      - DB_HOST=db
      - DOMAIN_NAME=${DOMAIN_NAME}
      - EMAIL_DOMAIN=${EMAIL_DOMAIN}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_POSTMARK_API_URL=${EMAIL_POSTMARK_API_URL}
      - EMAIL_POSTMARK_API_KEY=${EMAIL_POSTMARK_API_KEY}
      - POSTMARK_WEBHOOK_USERNAME=${POSTMARK_WEBHOOK_USERNAME}
      - POSTMARK_WEBHOOK_PASSWORD=${POSTMARK_WEBHOOK_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - SECRET_KEY=${SECRET_KEY}
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - EXTRA_ALLOWED_HOSTS=${EXTRA_ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - gregory_network
    depends_on:
      - db
    healthcheck:
      # Same readiness check entrypoint.sh's wait_for_db already uses.
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  gregory-mcp:
    container_name: gregory-mcp
    restart: always
    build: ./mcp-server
    ports:
      - 127.0.0.1:8001:8001
    environment:
      # Base URL of the GregoryAI instance this server proxies. Defaults to
      # the sibling `gregory` container for local dev; point it at a public
      # instance (e.g. https://api.brain-regeneration.com) in production.
      - GREGORY_API_URL=${GREGORY_MCP_API_URL:-http://gregory:8000}
    networks:
      - gregory_network
    depends_on:
      gregory:
        condition: service_healthy

networks:
  gregory_network:
    external: false
    name: gregory_network
  default:
    driver: bridge
