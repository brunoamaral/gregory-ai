          I, II, III, etc.) — free text, so it silently misses spelling/format variants
          (e.g. "Phase III" vs "Phase 3"). Prefer phase_normalized.
      - in: query
        name: phase_normalized
        schema:
          type: array
          items:
            type: string
            nullable: true
            enum:
            - early_phase_1
            - not_applicable
            - other
            - phase_1
            - phase_1_2
            - phase_2
            - phase_2_3
            - phase_3
            - phase_3_4
            - phase_4
            - post_market
        description: |-
          Exact match against the canonical phase; accepts one or more comma-separated values (OR semantics). One of: early_phase_1, phase_1, phase_1_2, phase_2, phase_2_3, phase_3, phase_3_4, phase_4, post_market, not_applicable, other.

          * `early_phase_1` - Early Phase 1
          * `phase_1` - Phase 1
          * `phase_1_2` - Phase 1/2
          * `phase_2` - Phase 2
          * `phase_2_3` - Phase 2/3
          * `phase_3` - Phase 3
          * `phase_3_4` - Phase 3/4
          * `phase_4` - Phase 4
          * `post_market` - Post-market
          * `not_applicable` - Not applicable
          * `other` - Other
        explode: false
        style: form
      - in: query
        name: primary_sponsor
        schema:
          type: string
        description: Legacy free-text case-insensitive substring filter on the raw
          registry sponsor string — silently misses spelling/duplicate variants across
          registries; prefer sponsor_id/sponsor_slug.
      - in: query
        name: recruitment_status
        schema:
          type: string
        description: Raw-text case-insensitive exact match against the registry's
          own recruitment-status string (e.g. "Recruiting" matches "RECRUITING" but
          not "Not Recruiting") — free text, so it silently misses spelling/format
          variants across registries. Prefer recruitment_status_normalized.
      - in: query
        name: recruitment_status_normalized
        schema:
          type: array
          items:
            type: string
            nullable: true
            enum:
            - active_not_recruiting
            - completed
            - enrolling_by_invitation
            - not_recruiting
            - not_yet_recruiting
            - other
            - recruiting
            - suspended
            - terminated
            - unknown
            - withdrawn
        description: |-
          Exact match against the canonical recruitment status; accepts one or more comma-separated values (OR semantics). One of: not_yet_recruiting, recruiting, enrolling_by_invitation, active_not_recruiting, not_recruiting, suspended, completed, terminated, withdrawn, unknown, other.

          * `not_yet_recruiting` - Not yet recruiting
          * `recruiting` - Recruiting
          * `enrolling_by_invitation` - Enrolling by invitation
          * `active_not_recruiting` - Active, not recruiting
          * `not_recruiting` - Not recruiting
          * `suspended` - Suspended
          * `completed` - Completed
          * `terminated` - Terminated
          * `withdrawn` - Withdrawn
          * `unknown` - Unknown
          * `other` - Other
        explode: false
        style: form
      - in: query
        name: region
        schema:
          type: string
          enum:
          - africa
          - asia
          - europe
          - north_america
          - oceania
          - south_america
        description: |-
          Exact match against a normalized region derived from the trial's countries; one of: africa, asia, europe, north_america, south_america, oceania (e.g. ?region=europe).

          * `africa` - Africa
          * `asia` - Asia
          * `europe` - Europe
          * `north_america` - North America
          * `south_america` - South America
          * `oceania` - Oceania
      - in: query
        name: search
        schema:
          type: string
        description: Boolean search across title, summary and scientific title. Bare
          terms are AND-ed; uppercase OR/NOT and "quoted phrases" are supported. Registries
          outside ClinicalTrials.gov usually put a trial's name and acronym only in
          the scientific title.
      - in: query
        name: site_id
        schema:
          type: number
        description: Filter by Django Site ID; returns trials carrying a subject in
          that site's scope (see CustomSetting.scope_subjects).
      - in: query
        name: source_id
        schema:
          type: integer
        description: Filter by source ID (see /sources/).
      - in: query
        name: source_register
        schema:
          type: string
        description: Filter by source registry (case-insensitive substring).
      - in: query
        name: sponsor_id
        schema:
          type: number
        description: Exact match against a canonical sponsor's id (see /sponsors/).
      - in: query
        name: sponsor_slug
        schema:
          type: string
        description: Exact match against a canonical sponsor's slug (see /sponsors/).
      - in: query
        name: status
        schema:
          type: string
        description: Legacy alias for recruitment_status — same raw-text, case-insensitive
          exact match. Prefer recruitment_status_normalized.
      - in: query
        name: study_type
        schema:
          type: string
        description: Legacy free-text case-insensitive substring filter on the raw
          registry study-type string — can both overmatch and undermatch across registries
          (e.g. matches "Interventional clinical trial of medicinal product" but misses
          "Intervention"); prefer study_type_normalized.
      - in: query
        name: study_type_normalized
        schema:
          type: string
          nullable: true
          enum:
          - basic_science
          - expanded_access
          - interventional
          - observational
          - other
        description: |-
          Exact match against the canonical study type; one of: interventional, observational, expanded_access, basic_science, other.

          * `interventional` - Interventional
          * `observational` - Observational
          * `expanded_access` - Expanded access
          * `basic_science` - Basic science
          * `other` - Other
      - in: query
        name: subject_id
        schema:
          type: integer
        description: Filter by subject ID (see /subjects/).
      - in: query
        name: subjects
        schema:
          type: array
          items:
            type: integer
        description: Comma-separated list of subject IDs with AND semantics — returns
          only trials tagged with *all* listed subjects, e.g. ?subjects=1,2.
        explode: false
        style: form
      - in: query
        name: subjects_any
        schema:
          type: array
          items:
            type: string
        description: Comma-separated list of subject IDs with OR semantics — returns
          trials tagged with *any* of the listed subjects, e.g. ?subjects_any=1,2.
        explode: false
        style: form
      - in: query
        name: summary
        schema:
          type: string
        description: Case-insensitive substring match against the summary only.
      - in: query
        name: team_id
        schema:
          type: integer
        description: Filter by team ID.
      - in: query
        name: therapeutic_areas
        schema:
          type: string
        description: Filter by therapeutic areas (case-insensitive substring).
      - in: query
        name: title
        schema:
          type: string
        description: Case-insensitive substring match against the title only.
      - in: query
        name: trial_id
        schema:
          type: integer
        description: Filter by a specific trial ID.
      tags:
      - trials
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrialSiteRowList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedTrialSiteRowList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/csv:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /trials/stats/:
    get:
      operationId: trials_stats_retrieve
      description: |-
        Recruitment-status totals (by ``recruitment_status_normalized``) over the
        filtered queryset.

        Accepts the same query parameters as the list endpoint (team_id,
        subject_id, recruitment_status_normalized, search, registry identifiers, …)
        and the same org-visibility scoping, so the totals always match what the
        equivalent list request would return. Cached server-side; see
        ``CachedStatsActionMixin``.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      tags:
      - trials
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialsStats'
            text/csv:
              schema:
                $ref: '#/components/schemas/TrialsStats'
          description: ''
components:
  schemas:
    AccessEnum:
      enum:
      - unknown
      - open
      - restricted
      type: string
      description: |-
        * `unknown` - Unknown
        * `open` - Open
        * `restricted` - Restricted
    AlgorithmEnum:
      enum:
      - pubmed_bert
      - lgbm_tfidf
      - lstm
      - unknown
      type: string
      description: |-
        * `pubmed_bert` - PubMed BERT
        * `lgbm_tfidf` - LGBM TF-IDF
        * `lstm` - LSTM
        * `unknown` - Unknown
    Article:
      type: object
      description: |-
        ``?include=editorial`` for articles and patents: one entry per site,
        since their editorial content is per site (``ArticleSiteContent``,
        ``PatentSiteContent``). Patents override the two attributes below.
      properties:
        article_id:
          type: integer
          readOnly: true
        title:
          type: string
        summary:
          type: string
          nullable: true
        link:
          type: string
          format: uri
          description: First URL seen for this article; stable after first import.
            Corresponds to "link" in the API response.
          maxLength: 2000
        links:
          nullable: true
          description: All known URLs for this article, keyed by registry slug (e.g.
            "ctgov") for known registries or by hostname otherwise. Managed automatically.
            Corresponds to "links" in the API response.
        published_date:
          type: string
          format: date-time
          nullable: true
        sources:
          type: array
          items:
            type: string
            nullable: true
          readOnly: true
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
          readOnly: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subjects'
          readOnly: true
        publisher:
          type: string
          nullable: true
          maxLength: 150
        container_title:
          type: string
          nullable: true
          maxLength: 150
        authors:
          type: array
          items:
            $ref: '#/components/schemas/ArticleAuthor'
          readOnly: true
        discovery_date:
          type: string
          format: date-time
          readOnly: true
        article_subject_relevances:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSubjectRelevance'
          readOnly: true
        doi:
          type: string
          nullable: true
          maxLength: 280
        pmid:
          type: string
          nullable: true
          description: PubMed ID, digits only. The first dedup key.
          maxLength: 20
        pmcid:
          type: string
          nullable: true
          description: PubMed Central ID, with its PMC prefix.
          maxLength: 20
        publication_types:
          type: array
          items:
            type: string
          readOnly: true
        mesh:
          type: array
          items:
            $ref: '#/components/schemas/ArticleMeshHeading'
          readOnly: true
        keywords:
          type: array
          items:
            type: string
          readOnly: true
        access:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AccessEnum'
          - $ref: '#/components/schemas/NullEnum'
        editorial:
          type: array
          items:
            $ref: '#/components/schemas/EditorialSiteEntry'
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/TeamCategory'
          readOnly: true
        ml_predictions:
          type: array
          items:
            $ref: '#/components/schemas/MLPredictions'
          readOnly: true
        ml_score:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Average ML probability score across the latest prediction per
            (algorithm, subject) pair. Updated automatically when predictions are
            saved.
        clinical_trials:
          type: array
          items: {}
          description: Get trials referenced in the article
          readOnly: true
      required:
      - article_id
      - article_subject_relevances
      - authors
      - categories
      - clinical_trials
      - discovery_date
      - keywords
      - link
      - mesh
      - ml_predictions
      - ml_score
      - publication_types
      - sources
      - subjects
      - teams
      - title
    ArticleAuthor:
      type: object
      properties:
        author_id:
          type: integer
          readOnly: true
        given_name:
          type: string
          maxLength: 150
        family_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        ORCID:
          type: string
          nullable: true
          maxLength: 150
        country:
          type: string
          nullable: true
          readOnly: true
      required:
      - author_id
      - country
      - family_name
      - full_name
      - given_name
    ArticleMeshHeading:
      type: object
      properties:
        descriptor:
          type: string
          readOnly: true
        qualifier:
          type: string
          readOnly: true
          nullable: true
        major_topic:
          type: boolean
          description: MajorTopicYN of the descriptor on its own row, of the qualifier
            on a pair row.
      required:
      - descriptor
      - qualifier
    ArticleSubjectRelevance:
      type: object
      properties:
        subject:
          allOf:
          - $ref: '#/components/schemas/Subjects'
          readOnly: true
        subject_id:
          type: integer
          writeOnly: true
        is_relevant:
          type: boolean
          nullable: true
          description: Indicates if the article is relevant for the subject. NULL
            means not reviewed.
      required:
      - subject
      - subject_id
    ArticlesByAccess:
      type: object
      properties:
        open:
          type: integer
        restricted:
          type: integer
        unknown:
          type: integer
      required:
      - open
      - restricted
      - unknown
    ArticlesStats:
      type: object
      description: Response of ``GET /articles/stats/`` — see ArticleViewSet.build_stats_payload.
      properties:
        total:
          type: integer
          description: Distinct articles matching the filtered queryset.
        by_access:
          $ref: '#/components/schemas/ArticlesByAccess'
        relevant:
          type: integer
          description: Count matching the same semantics as ?relevant=true on the
            list endpoint.
        retracted:
          type: integer
        missing_doi:
          type: integer
        by_subject:
          type: array
          items:
            $ref: '#/components/schemas/SubjectCount'
      required:
      - by_access
      - by_subject
      - missing_doi
      - relevant
      - retracted
      - total
    Author:
      type: object
      properties:
        author_id:
          type: integer
          readOnly: true
        given_name:
          type: string
          maxLength: 150
        family_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          nullable: true
          description: Auto-generated from given_name and family_name
          maxLength: 301
        ORCID:
          type: string
          nullable: true
          maxLength: 150
        country:
          type: string
          nullable: true
          readOnly: true
        biography:
          type: string
          nullable: true
        credit_name:
          type: string
          nullable: true
          description: Researcher's preferred display name from ORCID (person.name.credit-name).
          maxLength: 301
        orcid_keywords:
          description: Research keywords from ORCID.
        external_ids:
          description: External identifiers from ORCID, e.g. [{'type', 'value', 'url'}].
        researcher_urls:
          description: Researcher URLs from ORCID, e.g. [{'name', 'url'}].
        current_affiliation:
          type: string
          nullable: true
          description: Organization name of the author's current (or most recent)
            employment from ORCID.
          maxLength: 255
        orcid_claimed:
          type: boolean
          nullable: true
          description: Whether the ORCID record has been claimed by the researcher.
        orcid_verified_email:
          type: boolean
          nullable: true
          description: Whether the ORCID record has a verified email.
        articles_count:
          type: integer
          readOnly: true
        relevant_articles_count:
          type: integer
          readOnly: true
        articles_list:
          type: string
          description: |-
            Absolute URL of this author's articles, on the requested host.

            One instance serves several frontends, so the link is built from the
            host the request was made to rather than a single configured domain.
            The scheme follows X-Forwarded-Proto when a proxy sets it.
          readOnly: true
      required:
      - articles_count
      - articles_list
      - author_id
      - country
      - family_name
      - given_name
      - relevant_articles_count
    BasisEnum:
      enum:
      - category
      - subject
      type: string
      description: |-
        * `category` - Shared team category
        * `subject` - Shared subject only
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category_description:
          type: string
          nullable: true
        category_name:
          type: string
          maxLength: 200
        category_slug:
          nullable: true
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        category_terms:
          type: array
          items:
            type: string
            maxLength: 100
          title: Terms to include in category (comma separated)
          description: Add terms separated by commas.
        category_exclude_terms:
          type: array
          items:
            type: string
            maxLength: 100
          title: Terms to exclude from category (comma separated)
          description: Content containing any of these terms in a searched field is
            never assigned automatically, whatever its score. Manual assignments are
            not affected.
        modality:
          nullable: true
          description: |-
            Intervention modality group. Curated by hand (seeded by sync_category_modalities); null means not yet classified.

            * `small_molecule` - Small-molecule drug
            * `biologic_antibody` - Antibody / biologic
            * `cell_gene_therapy` - Cell / gene therapy
            * `rehabilitation` - Rehabilitation / physical
            * `device_neuromodulation` - Device / neuromodulation
            * `natural_product` - Natural product / supplement
            * `research_topic` - Research topic (not an intervention)
            * `other` - Other
          oneOf:
          - $ref: '#/components/schemas/ModalityEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        article_count_total:
          type: integer
          description: |-
            Prefer the queryset's Count(..., distinct=True) annotation; fall
            back to a live count for an un-annotated instance (e.g. built
            directly in a test).
          readOnly: true
        trials_count_total:
          type: integer
          description: |-
            Prefer the queryset's Count(..., distinct=True) annotation; fall
            back to a live count for an un-annotated instance.
          readOnly: true
        patents_count_total:
          type: integer
          description: |-
            Patent families in the category within the caller's patent scope
            (only sites with patents enabled count).
          readOnly: true
        medicines_count:
          type: integer
          description: |-
            EMA medicines linked to the category that the caller may see: live
            links only, generics and biosimilars left out as on /medicines/, and 0
            where the site's ``medicines_enabled`` is off.
          readOnly: true
        authors_count:
          type: integer
          description: Optimized authors count avoiding complex JOINs
          readOnly: true
        top_authors:
          type: array
          items: {}
          description: Optimized top authors calculation avoiding complex JOINs
          readOnly: true
        monthly_counts:
          type: object
          additionalProperties: {}
          nullable: true
          description: Get monthly counts of articles and trials when requested
          readOnly: true
      required:
      - article_count_total
      - authors_count
      - category_name
      - id
      - medicines_count
      - monthly_counts
      - patents_count_total
      - top_authors
      - trials_count_total
    CategoryTypeEnum:
      enum:
      - manual
      - automatic
      type: string
      description: |-
        * `manual` - Manual
        * `automatic` - Automatic
    ChangeEnum:
      enum:
      - created
      - updated
      - deleted
      type: string
      description: |-
        * `created` - created
        * `updated` - updated
        * `deleted` - deleted
    EditorCategoryAssignmentResponse:
      type: object
      properties:
        article_id:
          type: integer
        category_id:
          type: integer
        source:
          type: string
          description: Always `manual` after an editor assigns it; the pipeline never
            removes a manual assignment.
        updated_by:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - article_id
      - category_id
      - source
      - updated_at
      - updated_by
    EditorCategoryCreate:
      type: object
      properties:
        category_name:
          type: string
          maxLength: 200
        subject_ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: Subjects the category applies to. Each must be in the editor's
            site scope and all must belong to one team, which becomes the category's
            team.
          minItems: 1
        category_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: Words or phrases matched against titles and summaries, case-insensitively.
            Blank entries are dropped and repeats (ignoring case) kept once. At least
            one is required for an automatic category.
        category_exclude_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: 'Words or phrases that keep content out of the category: content
            containing any of them in a searched field is never assigned automatically,
            whatever its score. Matched like `category_terms`. Manual assignments
            are not affected. Optional, also for an automatic category.'
        category_description:
          type: string
          default: ''
        category_slug:
          type: string
          description: Defaults to the slugified name. Slugs are unique across every
            team.
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        modality:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ModalityEnum'
          - $ref: '#/components/schemas/NullEnum'
        category_type:
          allOf:
          - $ref: '#/components/schemas/CategoryTypeEnum'
          default: automatic
          description: |-
            `automatic` (default): the pipeline assigns content by the terms. `manual`: only hand assignments.

            * `manual` - Manual
            * `automatic` - Automatic
        match_scope:
          allOf:
          - $ref: '#/components/schemas/MatchScopeEnum'
          default: title_summary
      required:
      - category_name
      - subject_ids
    EditorCategoryResponse:
      type: object
      properties:
        id:
          type: integer
        category_name:
          type: string
        category_slug:
          type: string
        category_description:
          type: string
          nullable: true
        category_terms:
          type: array
          items:
            type: string
        category_exclude_terms:
          type: array
          items:
            type: string
        modality:
          type: string
          nullable: true
        category_type:
          $ref: '#/components/schemas/CategoryTypeEnum'
        match_scope:
          $ref: '#/components/schemas/MatchScopeEnum'
        team_id:
          type: integer
        subject_ids:
          type: array
          items:
            type: integer
        article_count:
          type: integer
        trials_count:
          type: integer
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: When the pipeline last matched content to this category. Null
            for a new category; after a change to terms, subjects or scope the next
            pipeline run re-matches all content for it.
        updated_by:
          type: string
          nullable: true
          description: Who last changed the category.
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - article_count
      - category_description
      - category_exclude_terms
      - category_name
      - category_slug
      - category_terms
      - category_type
      - id
      - last_synced_at
      - match_scope
      - modality
      - subject_ids
      - team_id
      - trials_count
      - updated_at
      - updated_by
    EditorCategoryUnassignResponse:
      type: object
      properties:
        article_id:
          type: integer
        category_id:
          type: integer
        removed:
          type: string
          description: 'Always `manual`: only a hand assignment can be removed.'
      required:
      - article_id
      - category_id
      - removed
    EditorError:
      type: object
      description: DRF's standard error body on the ``/editor/`` routes.
      properties:
        detail:
          type: string
        article_ids:
          type: array
          items:
            type: integer
          description: 'On 409 from the DOI lookup: the articles that share the DOI.'
        patent_ids:
          type: array
          items:
            type: integer
