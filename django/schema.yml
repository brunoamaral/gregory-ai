    PatchedEditorCategoryUpdate:
      type: object
      properties:
        category_name:
          type: string
          maxLength: 200
        category_description:
          type: string
        modality:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ModalityEnum'
          - $ref: '#/components/schemas/NullEnum'
        match_scope:
          $ref: '#/components/schemas/MatchScopeEnum'
        subject_ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: Replaces the category's subjects. Each must be in scope and
            in the category's team.
          minItems: 1
        category_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: Replaces every term. Words or phrases matched against titles
            and summaries, case-insensitively. Blank entries are dropped and repeats
            (ignoring case) kept once. Not with `add_terms` or `remove_terms`.
        add_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: Terms to add to the current ones; a term already there (ignoring
            case) is skipped.
        remove_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: Terms to remove, matched ignoring case. A term that isn't there
            is ignored.
        category_exclude_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: 'Replaces every excluded term. Words or phrases that keep content
            out of the category: content containing any of them in a searched field
            is never assigned automatically, whatever its score. Matched like `category_terms`.
            Manual assignments are not affected. Not with `add_exclude_terms` or `remove_exclude_terms`.'
        add_exclude_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: Excluded terms to add; one already there (ignoring case) is
            skipped.
        remove_exclude_terms:
          type: array
          items:
            type: string
            maxLength: 100
          description: Excluded terms to remove, matched ignoring case. One that isn't
            there is ignored.
    PatchedEditorialUpdateRequest:
      type: object
      properties:
        takeaways:
          type: string
        summary_plain_english:
          type: string
    PatentApplicant:
      type: object
      description: |-
        An applicant as published. ``sponsor_*`` is null for applicants not
        linked to a canonical sponsor, individuals among them.
      properties:
        raw_name:
          type: string
          maxLength: 500
        sponsor_id:
          type: integer
          nullable: true
          readOnly: true
        sponsor_name:
          type: string
          readOnly: true
        sponsor_slug:
          type: string
          readOnly: true
        is_individual:
          type: boolean
      required:
      - raw_name
      - sponsor_id
      - sponsor_name
      - sponsor_slug
    PatentDetail:
      type: object
      description: |-
        ``PatentListSerializer`` plus the member publications, inventors, IPC
        classes, source links and linked trials. ``claims`` is left out of the
        response unless the caller asks for ``?include=claims``: it averages
        ~12k characters and runs past 200k.
      properties:
        patent_id:
          type: integer
          readOnly: true
        family_id:
          type: string
          nullable: true
          maxLength: 20
        title:
          type: string
        summary:
          type: string
          nullable: true
        representative_publication:
          type: string
          maxLength: 32
        link:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        earliest_priority_date:
          type: string
          format: date
          nullable: true
        earliest_publication_date:
          type: string
          format: date
          nullable: true
        has_grant:
          type: boolean
          description: True when any member publication has a grant kind code. Heuristic
            until legal status is fetched.
        cpc_classes:
          type: array
          items:
            type: string
            maxLength: 40
        applicants:
          type: array
          items:
            $ref: '#/components/schemas/PatentApplicant'
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/TeamCategory'
          readOnly: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subjects'
          readOnly: true
        publications_count:
          type: integer
          readOnly: true
        trial_links_count:
          type: integer
          readOnly: true
        editorial:
          type: array
          items:
            $ref: '#/components/schemas/EditorialSiteEntry'
          readOnly: true
        publications:
          type: array
          items:
            $ref: '#/components/schemas/PatentPublication'
          readOnly: true
        inventors: {}
        ipc_classes:
          type: array
          items:
            type: string
            maxLength: 40
        links:
          nullable: true
          description: URLs keyed by source slug (e.g. "espacenet"); "link" holds
            the canonical one
        trial_links:
          type: array
          items:
            $ref: '#/components/schemas/PatentTrialLink'
          readOnly: true
        claims:
          type: string
          readOnly: true
          nullable: true
      required:
      - applicants
      - categories
      - claims
      - editorial
      - patent_id
      - publications
      - publications_count
      - subjects
      - title
      - trial_links
      - trial_links_count
    PatentList:
      type: object
      description: |-
        One patent family (``/patents/``). Relies on PatentViewSet.get_queryset()
        prefetching ``patent_applicants``, ``categories`` and ``subjects`` and
        annotating the two counts, so a page costs a constant number of queries.

        ``link`` is the Espacenet page for the family's representative publication
        and is always present: showing where a record came from is a condition of
        the EPO OPS licence this data is fetched under.
      properties:
        patent_id:
          type: integer
          readOnly: true
        family_id:
          type: string
          nullable: true
          maxLength: 20
