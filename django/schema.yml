  /sponsors/:
    get:
      operationId: sponsors_list
      description: |-
        List canonical sponsor entities (deduplicated trial sponsors — see
        docs/trials-field-normalization.md).

        A Sponsor carries no subject of its own; it reaches content only through
        the trials that name it. So it is scoped to "has at least one trial in the
        caller's scope" rather than by a field on the row — an Exists() over
        Trials.primary_sponsor_normalized. Without that, a sponsor's existence
        (and its name) would disclose that some trial the caller cannot read
        exists, which is the thing subject scoping is for.

        It carried no scoping at all before Phase 4 of site-scoped API visibility,
        on the grounds that sponsors are global. That was defensible while
        visibility was organisation-keyed and every caller effectively saw the same
        trials; it stops being defensible with two tenants.

        Measured after the 2026-09-10 orphan-sponsor prune: scoping hides 59 of
        4,686 (1.3%), all Dihydroartemisinin (subject 15, internal research in no
        site's scope) — the intended exclusion. Before that prune it looked like
        43%, but 3,406 of those sponsors referenced no trial at all and were
        debris left behind by the PROTECT FK when their trials were deleted.

        # Query Parameters:
        - **search** - search by sponsor name
        - **sponsor_type** - filter by sponsor type; one of: industry,
          academic_medical, government, nonprofit, other
        - **subject_id** - restrict to sponsors with >=1 trial in this subject
        - **subjects_any** - comma-separated subject IDs, OR semantics
        - **include_patent_applicants** - `true` also lists sponsors that appear only
          as applicants on patent families in the caller's patent scope (sites with
          `patents_enabled` on); off by default
        - **ordering** - 'name' (default) or 'trials_count' (add '-' for reverse)
        - **page_size** - items per page (max 100)

        Each row carries `trials_count` and `patents_count`, both scoped to what
        the caller may see. `patents_count` counts patent families the sponsor
        applied for within the caller's patent scope (0 for a caller whose sites do
        not show patents).

        # Examples:
        - Filter by type: `/sponsors/?sponsor_type=industry`
        - Search by name: `/sponsors/?search=novartis`
        - Most-trials first: `/sponsors/?ordering=-trials_count`
        - Sponsors active in a subject: `/sponsors/?subject_id=1`
        - Sponsors active in either subject: `/sponsors/?subjects_any=1,2`
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - in: query
        name: include_patent_applicants
        schema:
          type: boolean
        description: 'true: also list sponsors that are applicants on patent families
          in the caller''s patent scope but have no trial in scope. Off by default,
          so the list is exactly the sponsors with a trial. Only sites with patents
          enabled contribute patent applicants.'
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - name
            - -name
            - trials_count
            - -trials_count
        description: 'Sort field, prefix with `-` for descending (default: name).
          Accepts a comma-separated combination of the values above to break ties
          on a second field, e.g. ?ordering=name,-trials_count.'
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sponsor_type
        schema:
          type: string
          nullable: true
          enum:
          - academic_medical
          - government
          - industry
          - nonprofit
          - other
        description: |-
          Exact match against the canonical sponsor type (see SponsorType values).

          * `industry` - Industry
          * `academic_medical` - Academic / medical
          * `government` - Government
          * `nonprofit` - Non-profit / patient organisation
          * `other` - Other
      - in: query
        name: subject_id
        schema:
          type: number
        description: Restrict to sponsors with at least one trial in this subject
          (see /subjects/). A Sponsor carries no subject of its own — it is reached
          only through its trials, via Exists() on Trials.primary_sponsor_normalized
          (see SITE-API-VISIBILITY project, site-scoped API visibility).
      - in: query
        name: subjects_any
        schema:
          type: array
          items:
            type: string
        description: Comma-separated list of subject IDs, OR semantics — restrict
          to sponsors with at least one trial in any of the listed subjects, e.g.
          ?subjects_any=1,2. Same Exists()-on-trials approach as subject_id.
        explode: false
        style: form
      tags:
      - sponsors
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSponsorList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedSponsorList'
          description: ''
  /sponsors/{id}/:
    get:
      operationId: sponsors_retrieve
      description: |-
        List canonical sponsor entities (deduplicated trial sponsors — see
        docs/trials-field-normalization.md).

        A Sponsor carries no subject of its own; it reaches content only through
