      - trial_links_count
    PatentPublication:
      type: object
      properties:
        publication_number:
          type: string
          maxLength: 32
        country:
          type: string
          maxLength: 4
        kind:
          type: string
          maxLength: 4
        publication_date:
          type: string
          format: date
          nullable: true
        application_number:
          type: string
          nullable: true
          maxLength: 40
        application_date:
          type: string
          format: date
          nullable: true
      required:
      - publication_number
    PatentTrialLink:
      type: object
      description: |-
        A trial linked to a patent family, as nested on the patent detail
        (``trial_links``). The mirror of ``TrialPatentLinkSerializer``.
      properties:
        trial_id:
          type: integer
          readOnly: true
        trial_title:
          type: string
          readOnly: true
        sponsor_id:
          type: integer
          description: The sponsor shared by the patent (as applicant) and the trial.
          readOnly: true
        timing:
          $ref: '#/components/schemas/TimingEnum'
        days_after_completion:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 'For ''after'' links: days between the trial''s completion
            and the patent''s earliest priority date.'
        basis:
          allOf:
          - $ref: '#/components/schemas/BasisEnum'
          description: |-
            'category' when the patent and the trial share a team category (typically the molecule), the strong signal. 'subject' when they share only a subject; noisy for large sponsors.

            * `category` - Shared team category
            * `subject` - Shared subject only
      required:
      - basis
      - sponsor_id
      - timing
      - trial_id
      - trial_title
    PatentsByPriorityYear:
      type: object
      description: One entry of ``GET /patents/stats/`` ``by_priority_year``.
      properties:
        year:
          type: integer
          nullable: true
        count:
          type: integer
      required:
      - count
      - year
    PatentsStats:
      type: object
      description: Response of ``GET /patents/stats/`` — see PatentViewSet.build_stats_payload.
      properties:
        total:
          type: integer
        with_grant:
          type: integer
          description: Families with a granted publication (has_grant), a heuristic
            on kind codes.
        with_trial_link:
          type: integer
          description: Families with at least one visible, unsuppressed trial link.
            Category-basis links only unless include_subject_links=true.
        by_priority_year:
          type: array
          items:
            $ref: '#/components/schemas/PatentsByPriorityYear'
          description: 'Ascending by year of the earliest priority date; zero-count
            years omitted, a trailing {year: null} entry for families with no priority
            date (omitted when 0). Sums to total.'
      required:
      - by_priority_year
      - total
      - with_grant
      - with_trial_link
    PublicSite:
      type: object
      description: |-
        A publicly readable site, for the GET /sites/ discovery endpoint.

        Deliberately minimal: just enough for a caller to learn which site IDs
        exist so it can pass ?site_id=. Everything here is already public.

        Separate BY DESIGN from GET /tenants/ (McpTenantSerializer below), and
        the two must not converge: /sites/ is unscoped public discovery, and
        stays exactly as it is. /tenants/ carries MCP configuration -- prompts,
        documents, a description written for the model -- and, for a caller
        holding a site-bound key, can include that caller's own PRIVATE site.
        Folding the two together would leak a private site's existence and
        authored content to anyone who could call the unscoped endpoint.
      properties:
        site_id:
          type: integer
          readOnly: true
        domain:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - domain
      - name
      - site_id
    RelevanceRequest:
      type: object
      properties:
        is_relevant:
          type: boolean
          nullable: true
          description: true, false, or null for not reviewed.
      required:
      - is_relevant
