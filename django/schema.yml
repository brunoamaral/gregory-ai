    MedicineEvent:
      type: object
      description: |-
        One event in a medicine's regulatory life (``/medicines/events/``).

        ``kind_label`` is the same sentence the RSS feeds use (``MedicineEvent.in_words``),
        so a kind is never worded two ways. Relies on MedicineEventViewSet selecting
        the medicine.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/MedicineEventKindEnum'
        kind_label:
          type: string
          readOnly: true
        event_date:
          type: string
          format: date
          description: EMA's date where it gives one, otherwise the day the sync saw
            the change.
        basis:
          $ref: '#/components/schemas/MedicineEventBasisEnum'
        from_value:
          type: string
        to_value:
          type: string
        medicine:
          allOf:
          - $ref: '#/components/schemas/MedicineEventMedicine'
          readOnly: true
        source:
          type: string
          readOnly: true
      required:
      - basis
      - event_date
      - id
      - kind
      - kind_label
      - medicine
      - source
    MedicineEventBasisEnum:
      enum:
      - reconstructed
      - observed
      type: string
      description: |-
        * `reconstructed` - Reconstructed from EMA's dates
        * `observed` - Observed between syncs
    MedicineEventKindEnum:
      enum:
      - rolling_review_started
      - evaluation_started
      - opinion_positive
      - opinion_negative
      - opinion_adopted
      - authorised
      - ec_decision
      - indication_changed
      - refused
      - application_withdrawn
      - suspended
      - ended
      - status_changed
      type: string
      description: |-
        * `rolling_review_started` - Rolling review started
        * `evaluation_started` - Evaluation started
        * `opinion_positive` - CHMP positive opinion
        * `opinion_negative` - CHMP negative opinion
        * `opinion_adopted` - CHMP opinion adopted
        * `authorised` - Authorised
        * `ec_decision` - European Commission decision
        * `indication_changed` - Indication changed
        * `refused` - Refused
        * `application_withdrawn` - Application withdrawn
        * `suspended` - Suspended
        * `ended` - Authorisation ended
        * `status_changed` - Status changed
    MedicineEventMedicine:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        inn:
          type: string
        url:
          type: string
      required:
      - id
      - inn
      - name
      - url
    MedicineGroupedProduct:
      type: object
      description: |-
        A further EMA product for the same medicine, as ``grouped_products`` on the
        lead product's detail.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        url:
          description: The EPAR page on ema.europa.eu.
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
      required:
      - id
      - name
    MedicineHistoryEvent:
      type: object
      description: |-
        An event inside a medicine's own detail: the medicine is the parent, so it
        and its attribution are not repeated on each event.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/MedicineEventKindEnum'
        kind_label:
          type: string
          readOnly: true
        event_date:
          type: string
          format: date
          description: EMA's date where it gives one, otherwise the day the sync saw
            the change.
        basis:
          $ref: '#/components/schemas/MedicineEventBasisEnum'
        from_value:
          type: string
        to_value:
          type: string
      required:
      - basis
      - event_date
      - id
      - kind
      - kind_label
    MedicineSubject:
      type: object
      description: |-
        A subject EMA approved a medicine for, as ``subjects`` on a medicine.

        Built from a ``MedicineSubjectLink``: ``matched_on`` is the subject's EMA
        therapeutic area that matched.
      properties:
        id:
          type: integer
        subject_name:
          type: string
        subject_slug:
          type: string
        matched_on:
          type: string
      required:
      - id
      - matched_on
      - subject_name
      - subject_slug
    ModalityEnum:
      enum:
      - small_molecule
      - biologic_antibody
      - cell_gene_therapy
      - rehabilitation
      - device_neuromodulation
      - natural_product
      - research_topic
      - other
      type: string
      description: |-
        * `small_molecule` - Small-molecule drug
        * `biologic_antibody` - Antibody / biologic
        * `cell_gene_therapy` - Cell / gene therapy
        * `rehabilitation` - Rehabilitation / physical
        * `device_neuromodulation` - Device / neuromodulation
        * `natural_product` - Natural product / supplement
        * `research_topic` - Research topic (not an intervention)
        * `other` - Other
