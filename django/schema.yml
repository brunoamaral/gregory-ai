          nullable: true
          description: Canonical recruitment status derived from the raw 'recruitment_status'
            value; recomputed on every save.
        other_records:
          type: string
          nullable: true
          maxLength: 200
        inclusion_agemin:
          type: string
          nullable: true
          maxLength: 100
        inclusion_agemax:
          type: string
          nullable: true
          maxLength: 100
        inclusion_age_min_years:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Canonical minimum eligible age in years, derived from 'inclusion_agemin';
            recomputed on every save.
        inclusion_age_max_years:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Canonical maximum eligible age in years, derived from 'inclusion_agemax';
            recomputed on every save.
        inclusion_gender:
          type: string
          nullable: true
          maxLength: 500
        inclusion_gender_normalized:
          type: string
          readOnly: true
          nullable: true
          description: Canonical sex eligibility (all/female/male) derived from the
            raw 'inclusion_gender' value; recomputed on every save.
        date_enrollement:
          type: string
          format: date
          nullable: true
        target_size:
          type: string
          nullable: true
        study_type:
          type: string
          nullable: true
        study_type_normalized:
          type: string
          readOnly: true
          nullable: true
          description: Canonical study type derived from the raw 'study_type' value;
            recomputed on every save.
        study_design:
          type: string
          nullable: true
        phase:
          type: string
          nullable: true
        phase_normalized:
          type: string
          readOnly: true
          nullable: true
          description: Canonical trial phase derived from the raw 'phase' value; recomputed
            on every save.
        countries:
          type: string
          nullable: true
        countries_normalized:
          type: array
          items: {}
          nullable: true
          description: |-
            Flat, sorted list of normalized country codes (e.g. ["DE", "FR", "US"]) — the
            codes on trial_countries, without the per-country status/source detail. Uses the
            same prefetched cache as the `trial_countries` field.
          readOnly: true
        trial_countries:
          type: array
          items:
            $ref: '#/components/schemas/TrialCountry'
          readOnly: true
        regions_normalized:
          readOnly: true
          nullable: true
          description: Canonical region slugs (africa, asia, europe, north_america,
            south_america, oceania) derived from the trial's countries; recomputed
            on every save.
        inclusion_criteria:
          type: string
          nullable: true
        exclusion_criteria:
          type: string
          nullable: true
        condition:
          type: string
          nullable: true
        intervention:
          type: string
          nullable: true
        primary_outcome:
          type: string
          nullable: true
        secondary_outcome:
          type: string
          nullable: true
        secondary_id:
          type: string
          nullable: true
        source_support:
          type: string
          nullable: true
        ethics_review_status:
          type: string
          nullable: true
        ethics_review_approval_date:
          type: string
          format: date
          nullable: true
        ethics_review_contact_name:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 1000
          - type: string
            maxLength: 0
        ethics_review_contact_address:
          type: string
          nullable: true
        ethics_review_contact_phone:
          type: string
          nullable: true
        ethics_review_contact_email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 1000
          - type: string
            maxLength: 0
        results_date_completed:
          type: string
          format: date
          nullable: true
        results_url_link:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        results_yes_no:
          type: string
          nullable: true
          maxLength: 10
        results_ipd_plan:
          type: string
          nullable: true
          maxLength: 10
        results_ipd_description:
          type: string
          nullable: true
        therapeutic_areas:
          type: string
          nullable: true
        country_status:
          type: string
          nullable: true
        trial_region:
          type: string
          nullable: true
          maxLength: 500
        results_posted:
          type: boolean
        overall_decision_date:
          type: string
          format: date
          nullable: true
        countries_decision_date:
          nullable: true
        editorial:
          type: array
          items:
            $ref: '#/components/schemas/EditorialEntry'
          readOnly: true
        articles:
          type: array
          items: {}
          description: |-
            Get articles that reference this trial.

            Uses the prefetched ``article_references`` cache when available (populated
            by TrialViewSet via prefetch_related('article_references__article'))
            to avoid one query per trial on list responses.
          readOnly: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subjects'
          readOnly: true
        trial_sites:
          type: array
          items:
            $ref: '#/components/schemas/TrialSite'
          readOnly: true
        patent_links:
          type: array
          items:
            $ref: '#/components/schemas/TrialPatentLink'
          readOnly: true
      required:
      - articles
      - categories
      - countries_normalized
      - discovery_date
      - identifiers_normalized
      - inclusion_age_max_years
      - inclusion_age_min_years
      - inclusion_gender_normalized
      - last_updated
      - link
      - patent_links
      - phase_normalized
      - recruitment_status_normalized
      - regions_normalized
      - sources
      - sponsor
      - study_type_normalized
      - subjects
      - title
      - trial_countries
      - trial_id
      - trial_sites
    TrialPatentLink:
      type: object
      description: |-
        A patent family linked to a trial, as nested on the trial detail
        (``patent_links``). The mirror of ``PatentTrialLinkSerializer``.
      properties:
        patent_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        representative_publication:
          type: string
          readOnly: true
        timing:
          $ref: '#/components/schemas/TimingEnum'
        days_after_completion:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 'For ''after'' links: days between the trial''s completion
            and the patent''s earliest priority date.'
        basis:
          allOf:
          - $ref: '#/components/schemas/BasisEnum'
          description: |-
            'category' when the patent and the trial share a team category (typically the molecule), the strong signal. 'subject' when they share only a subject; noisy for large sponsors.

            * `category` - Shared team category
            * `subject` - Shared subject only
      required:
      - basis
      - patent_id
      - representative_publication
      - timing
      - title
    TrialSite:
      type: object
      description: |-
        Per-site rows from CTIS retrieve enrichment and/or ClinicalTrials.gov — see
        TRIAL-GEOGRAPHY-PLAN.md PR G2/G3. ``country`` is rendered as its ISO 3166-1
        alpha-2 code. Nested only on the trial detail response (``trial_sites`` is not
        part of ``TrialSerializer``'s fields, so it never appears on the list endpoint)
        — use ``GET /trials/sites/`` for a bulk, flat listing across many trials.
      properties:
        name:
          type: string
          nullable: true
          maxLength: 500
        site_type:
          type: string
          nullable: true
          maxLength: 200
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
          maxLength: 200
        state:
          type: string
          nullable: true
          maxLength: 200
        postcode:
          type: string
          nullable: true
          maxLength: 50
        country:
          type: string
          nullable: true
          readOnly: true
        investigator_name:
          type: string
          nullable: true
          maxLength: 300
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        sources: {}
      required:
      - country
    TrialSiteRow:
      type: object
      description: Row shape of ``GET /trials/sites/`` — see TrialViewSet.sites.
      properties:
        trial_id:
          type: integer
        name:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
      required:
      - city
      - country
      - latitude
      - longitude
      - name
      - trial_id
    TrialSponsor:
      type: object
      description: |-
        The canonical sponsor entity a trial's raw ``primary_sponsor`` resolves to —
        see docs/trials-field-normalization.md. Nested on TrialSerializer as ``sponsor``;
        null when the raw string hasn't been resolved yet.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 500
        sponsor_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SponsorTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - id
      - name
      - slug
    TrialsByCountry:
      type: object
      properties:
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 code, or null for trials with no TrialCountry
            rows.
        count:
          type: integer
      required:
      - count
      - country
    TrialsBySponsor:
      type: object
      properties:
        sponsor_id:
          type: integer
        slug:
          type: string
        name:
          type: string
        sponsor_type:
          type: string
          nullable: true
        count:
          type: integer
      required:
      - count
      - name
      - slug
      - sponsor_id
      - sponsor_type
    TrialsByYear:
      type: object
      properties:
        year:
          type: integer
          nullable: true
          description: Registration year, or null for trials with no date_registration.
        count:
          type: integer
      required:
      - count
      - year
    TrialsStats:
      type: object
      description: |-
        Response of ``GET /trials/stats/`` — see TrialViewSet.build_stats_payload.

        The recruitment-status bucket keys (``recruiting``, ``completed``, ...) are
        one key per ``TrialRecruitmentStatus`` value plus ``no_status`` — declared
        here as a representative subset via ``extra_fields``-style documentation in
        the field help text rather than one IntegerField per enum member, since the
        bucket set is derived from the enum at runtime (see
        docs/03-api-and-rss-feeds.md for the full key list).
      properties:
        total:
          type: integer
        no_status:
          type: integer
        by_subject:
          type: array
          items:
            $ref: '#/components/schemas/SubjectCount'
        by_phase:
          type: object
          additionalProperties:
            type: integer
          description: '{phase_slug: count, ..., ''no_phase'': count} — one key per
            TrialPhase value.'
        by_region:
          type: object
          additionalProperties:
            type: integer
          description: '{region_slug: count, ..., ''no_region'': count} — one key
            per TrialRegion value. Does not sum to total (a trial can span multiple
            regions).'
        by_country:
          type: array
          items:
            $ref: '#/components/schemas/TrialsByCountry'
        by_year:
          type: array
          items:
            $ref: '#/components/schemas/TrialsByYear'
        by_sponsor:
          type: array
          items:
            $ref: '#/components/schemas/TrialsBySponsor'
          description: Top 25 canonical sponsors by count, excluding unresolved sponsors.
        no_sponsor:
          type: integer
        by_sponsor_type:
          type: object
          additionalProperties:
            type: integer
          description: '{sponsor_type_slug: count, ..., ''no_type'': count} — one
            key per SponsorType value.'
        by_modality:
          type: object
          additionalProperties:
            type: integer
          description: '{modality_slug: count, ..., ''no_modality'': count} — one
            key per CategoryModality value. Not a partition of total (a trial can
            carry categories of several modalities).'
        by_study_type:
          type: object
          additionalProperties:
            type: integer
          description: '{study_type_slug: count, ..., ''no_study_type'': count} —
            one key per TrialStudyType value.'
        by_sex:
          type: object
          additionalProperties:
            type: integer
          description: '{sex_slug: count, ..., ''no_sex_data'': count} — one key per
            TrialSexEligibility value.'
      required:
      - by_country
      - by_modality
      - by_phase
      - by_region
      - by_sex
      - by_sponsor
      - by_sponsor_type
      - by_study_type
      - by_subject
      - by_year
      - no_sponsor
      - no_status
      - total
    ViaEnum:
      enum:
      - mcp
      - api_key
      - admin
      type: string
      description: |-
        * `mcp` - mcp
        * `api_key` - api_key
        * `admin` - admin
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw API key (no "Bearer"/"Basic" prefix) issued per organisation.
        Required for write endpoints (articles/post, articles/edit, trials/edit);
        optional on read endpoints, where it scopes org-visibility and does not unlock
        editorial content (use ?include=editorial).
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    editorServiceAuth:
      type: http
      scheme: bearer
      description: The MCP server's service credential (GREGORY_MCP_SERVICE_KEY),
        sent with X-Gregory-Editor-User and X-Gregory-Editor-Site naming the verified
        editor and the one site. Only the MCP server holds it; /editor/ is not reachable
        from the public internet.
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
