      type: object
      description: |-
        Mixin for DRF serializers that strips nested associations belonging to
        organisations the caller cannot see.

        Usage::

            class ArticleSerializer(OrgScopedSerializerMixin,
                                    serializers.HyperlinkedModelSerializer):
                ...

        Set ``_per_org_fields`` to a list of field names that should be omitted
        entirely when there is no organisation context (spec §6.2).
      properties:
        trial_id:
          type: integer
          readOnly: true
        title:
          type: string
        summary:
          type: string
          nullable: true
        summary_plain_english:
          type: string
          nullable: true
          description: Return plain-English summary from TrialOrgContent for the caller's
            org, or None.
          readOnly: true
        ctg_detailed_description:
          type: string
          nullable: true
          description: Detailed description from ClinicalTrials.gov API
        published_date:
          type: string
          format: date-time
          nullable: true
        discovery_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_updated:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        link:
          type: string
          format: uri
          maxLength: 2000
        links:
          nullable: true
          description: Registry URLs keyed by registry slug; "link" holds the canonical
            one
        sources:
          type: array
          items:
            type: string
            nullable: true
          readOnly: true
        identifiers:
          nullable: true
        team_categories:
          type: array
          items:
            $ref: '#/components/schemas/TeamCategory'
          readOnly: true
        export_date:
          type: string
          format: date-time
          nullable: true
        internal_number:
          type: string
          nullable: true
          maxLength: 100
        last_refreshed_on:
          type: string
          format: date
          nullable: true
        acronym:
          type: string
          nullable: true
          maxLength: 200
        scientific_title:
          type: string
          nullable: true
        primary_sponsor:
          type: string
          nullable: true
        secondary_sponsor:
          type: string
          nullable: true
        sponsor_type:
          type: string
          nullable: true
          maxLength: 500
        sponsor:
