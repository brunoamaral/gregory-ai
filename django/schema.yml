    EditorSourceInput:
      type: object
      description: |-
        The body of ``POST /editor/sources/`` and ``POST /editor/sources/preview/``.

        Which settings apply depends on `source_type`: a setting that belongs to another
        type is refused (400), and so is any field not listed here, so a stray `ignore_ssl`
        or `team_id` is never silently ignored. Empty values of another type's settings
        are tolerated.
      properties:
        source_type:
          allOf:
          - $ref: '#/components/schemas/SourceTypeEnum'
          description: |-
            `rss_papers`: an RSS feed of science papers. `rss_trials`: an RSS feed of clinical trials. `pubmed`: a PubMed search. `ctgov`: a ClinicalTrials.gov search.

            * `rss_papers` - RSS feed of science papers
            * `rss_trials` - RSS feed of clinical trials
            * `pubmed` - PubMed search
            * `ctgov` - ClinicalTrials.gov search
        subject_id:
          type: integer
          minimum: 1
          description: The subject everything this source brings in is tagged with.
            Must be in the editor's site scope (else 404). The source belongs to the
            subject's team.
        link:
          type: string
          nullable: true
          description: '`rss_papers`, `rss_trials`: the feed''s address (required).
            Must be http or https and resolve to public addresses only.'
          maxLength: 2000
        keyword_filter:
          type: string
          nullable: true
          description: '`rss_papers`: keep only papers whose title or summary contains
            one of these keywords. Comma-separated; quote phrases: "multiple sclerosis",
            alzheimer. A keyword matches anywhere in a word; end it with `*` to match
            only words that start with it (`oligodendro*` finds "oligodendrocyte",
            not "preoligodendrocyte").'
          maxLength: 2000
        pubmed_query:
          type: string
          nullable: true
          description: '`pubmed` (required): the PubMed search. No date clause: Gregory
            adds the creation-date window itself.'
          maxLength: 4000
        excluded_publication_types:
          type: array
          items:
            type: string
            maxLength: 200
          nullable: true
          description: '`pubmed`: publication type names to leave out, e.g. `Review`.
            Excluding a type also excludes the types under it. An unknown name is
            a 400.'
        ctgov_search_condition:
          type: string
          nullable: true
          description: '`ctgov`: searched in each trial''s conditions. Fill in at
            least one of the three.'
          maxLength: 500
        ctgov_search_intervention:
          type: string
          nullable: true
          description: '`ctgov`: searched in each trial''s interventions.'
          maxLength: 500
        ctgov_search_term:
          type: string
          nullable: true
          description: '`ctgov`: searched anywhere in a trial''s record.'
          maxLength: 500
        name:
          type: string
          nullable: true
          description: Create only (the preview ignores it). Defaults to `RSS | <subject>`,
            `PubMed | <subject>` or `CTGov | <subject>`.
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Create only (the preview ignores it). Notes for people; Gregory
            never reads them.
          maxLength: 5000
      required:
      - source_type
      - subject_id
