      type: object
      properties:
        article_id:
          type: integer
        subject_id:
          type: integer
        is_relevant:
          type: boolean
          nullable: true
        updated_by:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
