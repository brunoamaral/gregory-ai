          enum:
          - academic_medical
          - government
          - industry
          - nonprofit
          - other
        description: |-
          Exact match against the canonical sponsor type (see SponsorType values).

          * `industry` - Industry
          * `academic_medical` - Academic / medical
          * `government` - Government
          * `nonprofit` - Non-profit / patient organisation
