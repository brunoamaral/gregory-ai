        **Generics, biosimilars and duplicate products are hidden by default.** Products
        with `generic` or `biosimilar` set are left out of the list unless
        `?include_generics=true`. So are further EMA products for the same medicine (same
        substances and indication): one product leads, the others carry `grouped_under`
        (the lead's id) and are listed only with `include_generics=true`. The lead's
        detail lists them as `grouped_products`. A single record is returned whatever it
        is.

        **`latest_ec_decision_date` is not the approval date.** It is the date of the
        most recent European Commission decision, which is usually a variation (a new
        indication, a label change). `authorisation_date` is the first approval; the two
        usually differ. Do not show the former as
        "approved on".

        JSON only: no CSV, and `?all_results=true` is ignored (you get an ordinary
        page). Page with `page` / `page_size` (max 100).

        # Query Parameters:
        - **category_id** - one category ID, or a comma-separated list matching ANY of them (`?category_id=6,21`)
        - **category_slug** - filter by category slug
        - **subject_id** - medicines linked to a category that has this subject, or approved by EMA for one of its conditions
        - **site_id** - filter by Django Site ID; medicines linked to a category with a subject in that site's scope, or approved for one of those subjects. A site with `medicines_enabled` off returns nothing
        - **tracked** - `false`: no live link to a category you can see (shown only because EMA approved it for a condition); `true`: filed under at least one category you can see
        - **substance** - one substance, matched exactly (ignoring case) against the product's `substances`
        - **name** - part of the product's name (the brand name, including a former name in brackets), case-insensitive: `?name=ocrevus`
        - **status** - EMA's status wording, case-insensitive (`Authorised`, `Withdrawn`, `Refused`, `Opinion`, ...)
        - **opinion_status** - `Positive` or `Negative`; EMA only fills it while a product is at the opinion stage
        - **advanced_therapy** / **orphan_medicine** / **is_combination** - `true`/`false`
        - **authorised_after** / **authorised_before** - first authorisation date, inclusive, `YYYY-MM-DD` (invalid dates return 400)
        - **include_generics** - `true` also lists generic and biosimilar products, and duplicate products
        - **page**, **page_size**, **ordering**

        The four link filters (`category_id`, `category_slug`, `subject_id`, `site_id`)
        count live links only. Given together they must all hold on the **same** link:
        `?subject_id=1&category_id=6` means a live link to category 6, and category 6
        has subject 1. `subject_id` and `site_id` on their own accept either route (a
        category link, or a subject link); as soon as `category_id` or `category_slug` is
        given, only category links count. A medicine reached by several links is still
        listed once, and an invalid ID (`?category_id=6,abc`) returns 400.

        # Ordering:
        `?ordering=<field>` (prefix with `-` to reverse): `authorisation_date`,
        `latest_ec_decision_date`, `ema_last_updated` (default `-ema_last_updated`).
        Products without the date sort last in both directions; ties break on `-id`.
        Unrecognised values are silently ignored.

        # Fields:
        `id`, `ema_product_number`, `name`, `inn`, `active_substance`, `substances`,
        `is_combination`, `status`, `opinion_status`, `therapeutic_areas`, `atc_code`,
        `pharmacotherapeutic_group`, `indication`, `holder`, the flags
        (`advanced_therapy`, `orphan_medicine`, `conditional_approval`,
        `exceptional_circumstances`, `prime_priority_medicine`, `accelerated_assessment`,
        `additional_monitoring`, `biosimilar`, `generic`, `patient_safety`), the dates
        (`rolling_review_start_date`, `evaluation_start_date`, `opinion_date`,
        `authorisation_date`, `latest_ec_decision_date`, `refusal_date`,
        `application_withdrawal_date`, `suspension_date`, `end_date`,
        `ema_first_published`, `ema_last_updated`), `url`, `grouped_under`, `tracked`,
        `categories` (the live links the caller may see: `id`, `category_name`,
        `category_slug`), `subjects` (the conditions EMA approved it for the caller may
        see: `id`, `subject_name`, `subject_slug`, `matched_on`) and `source`.

        `GET /medicines/{id}/` adds `grouped_products` (the lead product's copies:
        `id`, `name`, `url`) and `events`, the product's regulatory history newest
        first. The same events across all products are at `/medicines/events/`.

        # Examples:
        - On a condition page: `/medicines/?subject_id=1&category_id=6`
        - Every medicine EMA approved for a condition, filed or not: `/medicines/?subject_id=13`
        - Only the ones no category covers yet: `/medicines/?subject_id=13&tracked=false`
        - In either of two categories: `/medicines/?category_id=6,21`
        - One substance, with its biosimilars and duplicates: `/medicines/?substance=natalizumab&include_generics=true`
        - By brand name: `/medicines/?name=ocrevus`
        - Authorised since 2024: `/medicines/?authorised_after=2024-01-01&ordering=-authorisation_date`
        - With its events: `/medicines/123/`
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: include_public
        schema:
          type: boolean
        description: |-
          Identified callers only (API key or signed-in user): add the scopes of every publicly readable site to your own, so a private site's frontend can read public content alongside its own. No-op for an anonymous caller, whose scope already is exactly that set.

          Undeclared but functional before Phase 4 of site-scoped API visibility, when it read 'adds public organisations' — organisations are no longer the visibility unit, so it is declared here with its current meaning rather than left to be discovered.
      tags:
      - medicines
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineDetail'
          description: ''
  /medicines/events/:
    get:
      operationId: medicines_events_list
      description: |-
        List what happened to EMA medicines, newest first: a CHMP opinion, an
        authorisation, a new European Commission decision, a change of indication, a
        withdrawal.

        **Source: European Medicines Agency.** Every row carries
        `"source": "European Medicines Agency"`, and the nested medicine's `url` is its
        EPAR page on ema.europa.eu.

        Visibility is `/medicines/`'s, applied through the event's medicine: a medicine
        is visible when it has a live link to a category with a subject in the caller's
        scope, or a live subject link (EMA approved it for one of a subject's conditions),
        and only on sites with **medicines_enabled** on. A caller whose sites do not show
        medicines gets an empty list. **Generics, biosimilars and duplicate products are
        hidden by default**; `?include_generics=true` lists their events too. `tracked`
        filters on whether the event's medicine is filed under a category the caller can
        see.

        Each row is `id`, `kind`, `kind_label` (the sentence the RSS feeds use, e.g.
        "Authorised in the EU"), `event_date`, `basis`, `from_value`, `to_value`, a small
        `medicine` (`id`, `name`, `inn`, `url`) and `source`. `basis` says where the event
        comes from. `observed` means Gregory saw the change between two syncs, and its
        `event_date` is EMA's date or the day the change was seen. `reconstructed` means it
        was read off EMA's date fields the first time the product was seen, so it is real
        history but is not news. `from_value` / `to_value` hold the old and new text for
        status and indication changes.

        An `ec_decision` event is the date of EMA's latest Commission decision, usually a
        variation. It is not the approval: that is the `authorised` event.

        JSON only, ordered `-event_date`, `-id`. Page with `page` / `page_size` (max 100);
        `?all_results=true` is ignored.

        # Query Parameters:
        - **category_id** - one category ID, or a comma-separated list matching ANY of them (`?category_id=6,21`)
        - **category_slug** - filter by category slug
        - **subject_id** - events of medicines linked to a category that has this subject, or approved by EMA for one of its conditions
        - **site_id** - filter by Django Site ID; events of medicines linked to a category with a subject in that site's scope, or approved for one of those subjects. A site with `medicines_enabled` off returns nothing
        - **tracked** - `false`: the event's medicine has no live link to a category you can see; `true`: it has one
        - **kind** - one kind or a comma-separated list (`opinion_positive`, `authorised`, `ec_decision`, `indication_changed`, ...)
        - **basis** - `observed` or `reconstructed`
        - **event_date_after** / **event_date_before** - inclusive, `YYYY-MM-DD` (invalid dates return 400)
        - **include_generics** - `true` also lists events of generic and biosimilar products, and of duplicate products
        - **page**, **page_size**

        The link filters follow the single-link rule of `/medicines/`: given together they
        must all hold on the same live link of the event's medicine. `subject_id` and
        `site_id` without `category_id` / `category_slug` accept a category link or a
        subject link; with a category filter only category links count.

        # Examples:
        - News for a condition page: `/medicines/events/?subject_id=1&category_id=6&basis=observed`
        - For one site: `/medicines/events/?site_id=3`
        - News on medicines no category covers yet: `/medicines/events/?site_id=3&tracked=false`
        - Positive opinions since January: `/medicines/events/?kind=opinion_positive&event_date_after=2026-01-01`
      parameters:
      - in: query
        name: basis
        schema:
          type: string
          enum:
          - observed
          - reconstructed
        description: |-
          observed: Gregory saw the change between two syncs; reconstructed: read off EMA's date fields the first time the product was seen.

          * `reconstructed` - Reconstructed from EMA's dates
          * `observed` - Observed between syncs
      - in: query
        name: category_id
        schema:
          type: array
          items:
            type: number
        description: 'Filter by category ID (see /categories/). One ID, or a comma-separated
          list that matches ANY of them, e.g. ?category_id=6,21. Only live links count:
          a link an editor removed never matches.'
        explode: false
        style: form
      - in: query
        name: category_slug
        schema:
          type: string
        description: Filter by category slug (see /categories/). Only live links count.
      - in: query
        name: event_date_after
        schema:
          type: string
          format: date
        description: Events dated on or after this date (YYYY-MM-DD, inclusive). Invalid
          dates return 400.
      - in: query
        name: event_date_before
        schema:
          type: string
          format: date
        description: Events dated on or before this date (YYYY-MM-DD, inclusive).
          Invalid dates return 400.
      - in: query
        name: include_generics
        schema:
          type: boolean
        description: 'Generic and biosimilar products, and duplicate products (further
          EMA products for the same medicine, grouped under a lead product: see `grouped_under`),
          are left out unless this is true. They are matched and stored like any other
          product; the default hides them so a list shows the originators.'
      - in: query
        name: include_public
        schema:
          type: boolean
        description: |-
          Identified callers only (API key or signed-in user): add the scopes of every publicly readable site to your own, so a private site's frontend can read public content alongside its own. No-op for an anonymous caller, whose scope already is exactly that set.

          Undeclared but functional before Phase 4 of site-scoped API visibility, when it read 'adds public organisations' — organisations are no longer the visibility unit, so it is declared here with its current meaning rather than left to be discovered.
      - in: query
        name: kind
        schema:
          type: array
          items:
            type: string
            enum:
            - application_withdrawn
            - authorised
            - ec_decision
            - ended
            - evaluation_started
            - indication_changed
            - opinion_adopted
            - opinion_negative
            - opinion_positive
            - refused
            - rolling_review_started
            - status_changed
            - suspended
        description: |-
          One kind, or a comma-separated list that matches ANY of them, e.g. ?kind=opinion_positive,authorised. Unknown values return 400.

          * `rolling_review_started` - Rolling review started
          * `evaluation_started` - Evaluation started
          * `opinion_positive` - CHMP positive opinion
          * `opinion_negative` - CHMP negative opinion
          * `opinion_adopted` - CHMP opinion adopted
          * `authorised` - Authorised
          * `ec_decision` - European Commission decision
          * `indication_changed` - Indication changed
          * `refused` - Refused
          * `application_withdrawn` - Application withdrawn
          * `suspended` - Suspended
          * `ended` - Authorisation ended
          * `status_changed` - Status changed
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: site_id
        schema:
          type: number
        description: 'Filter by Django Site ID: keep events of medicines linked to
          a category that has a subject in that site''s scope (see CustomSetting.scope_subjects),
          or approved by EMA for one of those subjects. Given together with category_id
          or category_slug, only category links count. A site that does not show medicines
          (medicines_enabled off) returns nothing. Only live links count.'
      - in: query
        name: subject_id
        schema:
          type: number
        description: 'Keep events of medicines for this subject (see /subjects/):
          linked to a category that has it, or approved by EMA for one of its conditions
          (a subject link). Only live links count. Given together with category_id
          or category_slug, only category links count, and all the filters must hold
          on the same link: ?subject_id=1&category_id=6 means a live link to category
          6, and category 6 has subject 1.'
      - in: query
        name: tracked
        schema:
          type: boolean
        description: 'false: no live link to a category you can see (the medicine
          shows only because EMA approved it for one of the site''s conditions); true:
          filed under at least one category you can see. Exactly `categories` empty
          or not on each row.'
      tags:
      - medicines
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMedicineEventList'
          description: ''
  /patents/:
    get:
      operationId: patents_list
      description: |-
        List patent families (one DOCDB simple family per record), newest discovery first.

        Patents are only visible through sites that have **patents_enabled** on
        (`CustomSetting.patents_enabled`, off by default). A caller whose sites do
        not show patents gets an empty list, and a 404 on a single record.

        Every record's `link` points to its Espacenet page. Showing where the data
        comes from is a condition of the EPO OPS licence it is fetched under, so
        keep the link wherever you display a patent.

        There is no CSV export and no `all_results`: the licence rules out bulk
        export of records. `?format=csv` is not a supported format here, and
        `?all_results=true` is ignored (you get an ordinary page). Page with
        `page` / `page_size` (max 100).

        # Query Parameters:
        - **search** - boolean search over title and summary (bare terms AND-ed; uppercase `OR`/`NOT`; `"quoted phrases"`). Claims are not searched
        - **title** - case-insensitive substring of the title only
        - **summary** - case-insensitive substring of the summary only
        - **subject_id** - filter by subject ID
        - **site_id** - filter by Django Site ID; patents carrying a subject in that site's scope. A site with `patents_enabled` off returns nothing
        - **category_id** / **category_slug** - filter by category
        - **category_modality** - filter by the intervention modality of the patent's categories; one of the `CategoryModality` values
        - **applicant_sponsor_id** / **applicant_sponsor_slug** - patents with an applicant linked to that sponsor (see `/sponsors/`)
        - **applicant** - case-insensitive substring of an applicant's published name; for applicants not linked to a sponsor
        - **priority_date_after** / **priority_date_before** - earliest priority date, inclusive, `YYYY-MM-DD` (invalid dates return 400)
        - **publication_date_after** / **publication_date_before** - earliest publication date, inclusive
        - **has_grant** - `true`/`false`; a heuristic on kind codes, not legal status
        - **cpc** - CPC class prefix match against any of the family's classes; comma-separated, OR (`?cpc=A61K31,A61P25/28`)
        - **publication_number** - any member publication, in any common format (`EP4123456A1`, `EP 4123456 A1`, `EP-4123456-A1`); without a kind code (`EP4123456`) it matches every kind. Comma-separated, OR
        - **family_id** - exact DOCDB family id
        - **has_trial_link** - `true`/`false`; at least one visible, unsuppressed link to a clinical trial
        - **include_subject_links** - `true` also counts and shows links that rest on a shared subject only (see below)
        - **include** - `editorial` adds the caller's own sites' takeaways and plain-English summary; on the detail only, `claims` adds the full claims text
        - **page**, **page_size**, **ordering**

        # Ordering:
        `?ordering=<field>` (prefix with `-` to reverse): `earliest_priority_date`,
        `earliest_publication_date`, `discovery_date` (default `-discovery_date`),
        `last_updated`. Families without the date sort last in both directions; ties
        break on `-patent_id`. Unrecognised values are silently ignored.

        # Fields:
        The list returns `patent_id`, `family_id`, `title`, `summary`,
        `representative_publication`, `link`, `earliest_priority_date`,
        `earliest_publication_date`, `has_grant`, `cpc_classes`, `applicants`
        (`raw_name`, `sponsor_id`, `sponsor_name`, `sponsor_slug`, `is_individual`),
        `categories`, `subjects`, `publications_count` and `trial_links_count`.

        `GET /patents/{id}/` adds `publications` (every member publication),
        `inventors` (names as published), `ipc_classes`, `links`, `trial_links`, and
        `claims` only with `?include=claims`.

        # Trial links:
        `trial_links` (and `trial_links_count`, `has_trial_link`) show a link only when it is
        not suppressed, its trial is visible to the caller, and its basis is
        `category`, meaning the patent and the trial share a team category,
        typically the molecule. Links that rest on a shared subject only (`basis`
        = `subject`) are 82% of all links and noisy for large sponsors; they appear
        only with `?include_subject_links=true`. The mirror is `patent_links` on
        `GET /trials/{id}/` and the `has_patent_link` filter on `/trials/`.

        # Stats Endpoint:
        `GET /patents/stats/` returns `total`, `with_grant`, `with_trial_link` and
        `by_priority_year` (`[{year, count}]`, ascending; a trailing `{year: null}`
        for families with no priority date) over the filtered queryset. It accepts
        the same query parameters as the list. Cached server-side.

        # Examples:
        - Granted EP patents on a molecule: `/patents/?category_slug=ocrelizumab&has_grant=true&publication_number=EP`
        - By CPC class: `/patents/?cpc=A61K31/70`
        - A publication number: `/patents/?publication_number=EP4123456`
        - Filed since 2020 with a trial: `/patents/?priority_date_after=2020-01-01&has_trial_link=true`
        - With claims: `/patents/123/?include=claims`
      parameters:
      - in: query
        name: applicant
        schema:
          type: string
        description: Case-insensitive substring of an applicant's name as published.
          Use it for applicants that are not linked to a sponsor (individuals, small
          companies); linked ones are better found with applicant_sponsor_id.
      - in: query
        name: applicant_sponsor_id
        schema:
          type: number
        description: Patents with an applicant linked to this canonical sponsor (see
          /sponsors/).
      - in: query
        name: applicant_sponsor_slug
        schema:
          type: string
        description: Patents with an applicant linked to the sponsor with this slug
          (see /sponsors/).
      - in: query
        name: category_id
        schema:
          type: integer
        description: Filter by category ID (see /categories/).
      - in: query
        name: category_modality
        schema:
          type: string
          enum:
          - biologic_antibody
          - cell_gene_therapy
          - device_neuromodulation
          - natural_product
          - other
          - rehabilitation
          - research_topic
          - small_molecule
        description: |-
          Filter by the intervention modality of the patent's categories; one of the CategoryModality values.

          * `small_molecule` - Small-molecule drug
          * `biologic_antibody` - Antibody / biologic
          * `cell_gene_therapy` - Cell / gene therapy
          * `rehabilitation` - Rehabilitation / physical
          * `device_neuromodulation` - Device / neuromodulation
          * `natural_product` - Natural product / supplement
          * `research_topic` - Research topic (not an intervention)
          * `other` - Other
      - in: query
        name: category_slug
        schema:
          type: string
        description: Filter by category slug (see /categories/).
      - in: query
        name: cpc
        schema:
          type: array
          items:
            type: string
        description: Prefix match against any of the family's CPC classes, comma-separated,
          OR semantics, e.g. ?cpc=A61K31,A61P25/28. Spaces are ignored; case-insensitive.
        explode: false
        style: form
      - in: query
        name: family_id
        schema:
          type: string
        description: Exact match against the DOCDB simple family id.
      - in: query
        name: has_grant
        schema:
          type: boolean
        description: 'true: families with a granted publication; false: without. A
          heuristic on the kind codes, not legal status.'
      - in: query
        name: has_trial_link
        schema:
          type: boolean
        description: 'true: families with at least one visible, unsuppressed link
          to a trial; false: without. Counts category-basis links only unless include_subject_links=true.'
      - in: query
        name: include
        schema:
          type: string
          enum:
          - editorial
        description: Opt in to extra content. Comma-separated; `editorial` adds an
          `editorial` list of the caller's own sites' `takeaways` and `summary_plain_english`
          (one entry per site, as on articles; see docs/03-api-and-rss-feeds.md).
          `claims` is detail-only and ignored here. Unknown values return 400.
      - in: query
        name: include_public
        schema:
          type: boolean
        description: |-
          Identified callers only (API key or signed-in user): add the scopes of every publicly readable site to your own, so a private site's frontend can read public content alongside its own. No-op for an anonymous caller, whose scope already is exactly that set.

          Undeclared but functional before Phase 4 of site-scoped API visibility, when it read 'adds public organisations' — organisations are no longer the visibility unit, so it is declared here with its current meaning rather than left to be discovered.
      - in: query
        name: include_subject_links
        schema:
          type: boolean
        description: Count and show links that rest on a shared subject only. They
          are noisy for large sponsors, so by default only links on a shared category
          are used (has_trial_link, trial_links, trial_links_count).
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - earliest_priority_date
            - -earliest_priority_date
            - earliest_publication_date
            - -earliest_publication_date
            - discovery_date
            - -discovery_date
            - last_updated
            - -last_updated
        description: Sort field, prefix with `-` for descending (default `-discovery_date`).
          Families without the date always sort last, in both directions. Ties break
          on `-patent_id`. Accepts a comma-separated combination of the values above
          to break ties on a second field, e.g. ?ordering=earliest_priority_date,-earliest_publication_date.
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority_date_after
        schema:
          type: string
          format: date
        description: Families whose earliest priority date is on or after this date
          (YYYY-MM-DD, inclusive). Invalid dates return 400.
      - in: query
        name: priority_date_before
        schema:
          type: string
          format: date
        description: Families whose earliest priority date is on or before this date
          (YYYY-MM-DD, inclusive). Invalid dates return 400.
      - in: query
        name: publication_date_after
        schema:
          type: string
          format: date
        description: Families whose earliest publication date is on or after this
          date (YYYY-MM-DD, inclusive). Invalid dates return 400.
      - in: query
        name: publication_date_before
        schema:
          type: string
          format: date
        description: Families whose earliest publication date is on or before this
          date (YYYY-MM-DD, inclusive). Invalid dates return 400.
      - in: query
        name: publication_number
        schema:
          type: array
          items:
            type: string
        description: 'Matches any publication in the family, in any common format:
          EP4123456A1, EP 4123456 A1, EP-4123456-A1. Without a kind code (EP4123456)
          it matches every kind. Comma-separated, OR semantics.'
        explode: false
        style: form
      - in: query
        name: search
        schema:
          type: string
        description: Boolean search across title and summary. Bare terms are AND-ed;
          uppercase OR/NOT and "quoted phrases" are supported. Claims are not searched.
      - in: query
        name: site_id
        schema:
          type: number
        description: Filter by Django Site ID; returns patents carrying a subject
          in that site's scope (see CustomSetting.scope_subjects). A site that does
          not show patents (patents_enabled off) returns nothing.
      - in: query
        name: subject_id
        schema:
          type: integer
        description: Filter by subject ID (see /subjects/).
      - in: query
        name: summary
        schema:
          type: string
        description: Case-insensitive substring match against the summary only.
      - in: query
        name: title
        schema:
          type: string
        description: Case-insensitive substring match against the title only.
      tags:
      - patents
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatentListList'
          description: ''
  /patents/{patent_id}/:
    get:
      operationId: patents_retrieve
      description: |-
        List patent families (one DOCDB simple family per record), newest discovery first.

        Patents are only visible through sites that have **patents_enabled** on
        (`CustomSetting.patents_enabled`, off by default). A caller whose sites do
        not show patents gets an empty list, and a 404 on a single record.

        Every record's `link` points to its Espacenet page. Showing where the data
        comes from is a condition of the EPO OPS licence it is fetched under, so
        keep the link wherever you display a patent.

        There is no CSV export and no `all_results`: the licence rules out bulk
        export of records. `?format=csv` is not a supported format here, and
        `?all_results=true` is ignored (you get an ordinary page). Page with
        `page` / `page_size` (max 100).

        # Query Parameters:
        - **search** - boolean search over title and summary (bare terms AND-ed; uppercase `OR`/`NOT`; `"quoted phrases"`). Claims are not searched
        - **title** - case-insensitive substring of the title only
        - **summary** - case-insensitive substring of the summary only
        - **subject_id** - filter by subject ID
        - **site_id** - filter by Django Site ID; patents carrying a subject in that site's scope. A site with `patents_enabled` off returns nothing
        - **category_id** / **category_slug** - filter by category
        - **category_modality** - filter by the intervention modality of the patent's categories; one of the `CategoryModality` values
        - **applicant_sponsor_id** / **applicant_sponsor_slug** - patents with an applicant linked to that sponsor (see `/sponsors/`)
        - **applicant** - case-insensitive substring of an applicant's published name; for applicants not linked to a sponsor
        - **priority_date_after** / **priority_date_before** - earliest priority date, inclusive, `YYYY-MM-DD` (invalid dates return 400)
        - **publication_date_after** / **publication_date_before** - earliest publication date, inclusive
        - **has_grant** - `true`/`false`; a heuristic on kind codes, not legal status
        - **cpc** - CPC class prefix match against any of the family's classes; comma-separated, OR (`?cpc=A61K31,A61P25/28`)
        - **publication_number** - any member publication, in any common format (`EP4123456A1`, `EP 4123456 A1`, `EP-4123456-A1`); without a kind code (`EP4123456`) it matches every kind. Comma-separated, OR
        - **family_id** - exact DOCDB family id
        - **has_trial_link** - `true`/`false`; at least one visible, unsuppressed link to a clinical trial
        - **include_subject_links** - `true` also counts and shows links that rest on a shared subject only (see below)
        - **include** - `editorial` adds the caller's own sites' takeaways and plain-English summary; on the detail only, `claims` adds the full claims text
        - **page**, **page_size**, **ordering**

        # Ordering:
        `?ordering=<field>` (prefix with `-` to reverse): `earliest_priority_date`,
        `earliest_publication_date`, `discovery_date` (default `-discovery_date`),
        `last_updated`. Families without the date sort last in both directions; ties
        break on `-patent_id`. Unrecognised values are silently ignored.

        # Fields:
        The list returns `patent_id`, `family_id`, `title`, `summary`,
        `representative_publication`, `link`, `earliest_priority_date`,
        `earliest_publication_date`, `has_grant`, `cpc_classes`, `applicants`
        (`raw_name`, `sponsor_id`, `sponsor_name`, `sponsor_slug`, `is_individual`),
        `categories`, `subjects`, `publications_count` and `trial_links_count`.

        `GET /patents/{id}/` adds `publications` (every member publication),
        `inventors` (names as published), `ipc_classes`, `links`, `trial_links`, and
        `claims` only with `?include=claims`.

        # Trial links:
        `trial_links` (and `trial_links_count`, `has_trial_link`) show a link only when it is
        not suppressed, its trial is visible to the caller, and its basis is
        `category`, meaning the patent and the trial share a team category,
        typically the molecule. Links that rest on a shared subject only (`basis`
        = `subject`) are 82% of all links and noisy for large sponsors; they appear
        only with `?include_subject_links=true`. The mirror is `patent_links` on
        `GET /trials/{id}/` and the `has_patent_link` filter on `/trials/`.

        # Stats Endpoint:
        `GET /patents/stats/` returns `total`, `with_grant`, `with_trial_link` and
        `by_priority_year` (`[{year, count}]`, ascending; a trailing `{year: null}`
        for families with no priority date) over the filtered queryset. It accepts
        the same query parameters as the list. Cached server-side.

        # Examples:
        - Granted EP patents on a molecule: `/patents/?category_slug=ocrelizumab&has_grant=true&publication_number=EP`
        - By CPC class: `/patents/?cpc=A61K31/70`
        - A publication number: `/patents/?publication_number=EP4123456`
        - Filed since 2020 with a trial: `/patents/?priority_date_after=2020-01-01&has_trial_link=true`
        - With claims: `/patents/123/?include=claims`
      parameters:
      - in: query
        name: include
        schema:
          type: string
          enum:
          - claims
          - editorial
        description: Opt in to extra content. Comma-separated. `claims` adds the family's
          full `claims` text (it averages ~12,000 characters and can run past 200,000,
          so it is never in the default response and not available on the list); `editorial`
          adds an `editorial` list of the caller's own sites' `takeaways` and `summary_plain_english`
          (one entry per site, as on articles; see docs/03-api-and-rss-feeds.md).
          Unknown values return 400.
      - in: query
        name: include_public
        schema:
          type: boolean
        description: |-
          Identified callers only (API key or signed-in user): add the scopes of every publicly readable site to your own, so a private site's frontend can read public content alongside its own. No-op for an anonymous caller, whose scope already is exactly that set.

          Undeclared but functional before Phase 4 of site-scoped API visibility, when it read 'adds public organisations' — organisations are no longer the visibility unit, so it is declared here with its current meaning rather than left to be discovered.
      - in: path
        name: patent_id
        schema:
          type: integer
        description: A unique integer value identifying this patent family.
        required: true
      tags:
      - patents
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentDetail'
          description: ''
  /patents/stats/:
    get:
      operationId: patents_stats_retrieve
      description: |-
