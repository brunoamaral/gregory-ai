  /medicines/:
    get:
      operationId: medicines_list
      description: |-
        List the medicines the European Medicines Agency (EMA) has authorised for human
        use in the EU, one record per EMA product, most recently updated first.

        **Source: European Medicines Agency.** Every record carries
        `"source": "European Medicines Agency"` and its `url` is the product's EPAR page
        on ema.europa.eu. Keep both wherever you display a medicine.

        Medicines are only visible through sites that have **medicines_enabled** on
        (`CustomSetting.medicines_enabled`, off by default). A medicine has no subject of
        its own. It is visible by either of two routes, each counted against the caller's
        scope:

        - it has a live (non-suppressed) link to a **category** that has a subject in the
          scope (a medicine an editor tracks), or
        - it has a live **subject link**: EMA approved it for one of a subject's conditions
          (the subject's EMA therapeutic areas), with or without a category.

        The two suppressions are independent. A subject link an editor suppressed does not
        hide a medicine that still has a live category link, and the other way round.
        A caller whose sites do not show medicines gets an empty list, and a 404 on a
        single record. A link an editor removed never counts, for visibility, for
        `categories`, for `subjects` or for any filter.

        **`tracked`** says whether the medicine is filed under a category the caller can
        see: it is `true` exactly when `categories` is not empty. `tracked=false` lists
        the medicines that show only because EMA approved them for one of the site's
        conditions, which is where an editor finds candidates for a new category.
        `subjects` lists the conditions EMA approved the medicine for (`id`,
        `subject_name`, `subject_slug`, `matched_on`), limited to the subjects in the
        caller's scope.

        **Generics, biosimilars and duplicate products are hidden by default.** Products
        with `generic` or `biosimilar` set are left out of the list unless
        `?include_generics=true`. So are further EMA products for the same medicine (same
        substances and indication): one product leads, the others carry `grouped_under`
        (the lead's id) and are listed only with `include_generics=true`. The lead's
        detail lists them as `grouped_products`. A single record is returned whatever it
        is.

        **`latest_ec_decision_date` is not the approval date.** It is the date of the
        most recent European Commission decision, which is usually a variation (a new
        indication, a label change). `authorisation_date` is the first approval; the two
        usually differ. Do not show the former as
        "approved on".

        JSON only: no CSV, and `?all_results=true` is ignored (you get an ordinary
        page). Page with `page` / `page_size` (max 100).

        # Query Parameters:
        - **category_id** - one category ID, or a comma-separated list matching ANY of them (`?category_id=6,21`)
        - **category_slug** - filter by category slug
        - **subject_id** - medicines linked to a category that has this subject, or approved by EMA for one of its conditions
        - **site_id** - filter by Django Site ID; medicines linked to a category with a subject in that site's scope, or approved for one of those subjects. A site with `medicines_enabled` off returns nothing
        - **tracked** - `false`: no live link to a category you can see (shown only because EMA approved it for a condition); `true`: filed under at least one category you can see
        - **substance** - one substance, matched exactly (ignoring case) against the product's `substances`
        - **name** - part of the product's name (the brand name, including a former name in brackets), case-insensitive: `?name=ocrevus`
        - **status** - EMA's status wording, case-insensitive (`Authorised`, `Withdrawn`, `Refused`, `Opinion`, ...)
        - **opinion_status** - `Positive` or `Negative`; EMA only fills it while a product is at the opinion stage
        - **advanced_therapy** / **orphan_medicine** / **is_combination** - `true`/`false`
        - **authorised_after** / **authorised_before** - first authorisation date, inclusive, `YYYY-MM-DD` (invalid dates return 400)
        - **include_generics** - `true` also lists generic and biosimilar products, and duplicate products
        - **page**, **page_size**, **ordering**

        The four link filters (`category_id`, `category_slug`, `subject_id`, `site_id`)
        count live links only. Given together they must all hold on the **same** link:
        `?subject_id=1&category_id=6` means a live link to category 6, and category 6
        has subject 1. `subject_id` and `site_id` on their own accept either route (a
        category link, or a subject link); as soon as `category_id` or `category_slug` is
        given, only category links count. A medicine reached by several links is still
        listed once, and an invalid ID (`?category_id=6,abc`) returns 400.

        # Ordering:
        `?ordering=<field>` (prefix with `-` to reverse): `authorisation_date`,
        `latest_ec_decision_date`, `ema_last_updated` (default `-ema_last_updated`).
        Products without the date sort last in both directions; ties break on `-id`.
        Unrecognised values are silently ignored.

        # Fields:
        `id`, `ema_product_number`, `name`, `inn`, `active_substance`, `substances`,
        `is_combination`, `status`, `opinion_status`, `therapeutic_areas`, `atc_code`,
        `pharmacotherapeutic_group`, `indication`, `holder`, the flags
        (`advanced_therapy`, `orphan_medicine`, `conditional_approval`,
        `exceptional_circumstances`, `prime_priority_medicine`, `accelerated_assessment`,
        `additional_monitoring`, `biosimilar`, `generic`, `patient_safety`), the dates
        (`rolling_review_start_date`, `evaluation_start_date`, `opinion_date`,
        `authorisation_date`, `latest_ec_decision_date`, `refusal_date`,
        `application_withdrawal_date`, `suspension_date`, `end_date`,
        `ema_first_published`, `ema_last_updated`), `url`, `grouped_under`, `tracked`,
        `categories` (the live links the caller may see: `id`, `category_name`,
        `category_slug`), `subjects` (the conditions EMA approved it for the caller may
        see: `id`, `subject_name`, `subject_slug`, `matched_on`) and `source`.

        `GET /medicines/{id}/` adds `grouped_products` (the lead product's copies:
        `id`, `name`, `url`) and `events`, the product's regulatory history newest
        first. The same events across all products are at `/medicines/events/`.

        # Examples:
        - On a condition page: `/medicines/?subject_id=1&category_id=6`
        - Every medicine EMA approved for a condition, filed or not: `/medicines/?subject_id=13`
        - Only the ones no category covers yet: `/medicines/?subject_id=13&tracked=false`
        - In either of two categories: `/medicines/?category_id=6,21`
        - One substance, with its biosimilars and duplicates: `/medicines/?substance=natalizumab&include_generics=true`
        - By brand name: `/medicines/?name=ocrevus`
        - Authorised since 2024: `/medicines/?authorised_after=2024-01-01&ordering=-authorisation_date`
        - With its events: `/medicines/123/`
      parameters:
      - in: query
        name: advanced_therapy
        schema:
          type: boolean
        description: 'true: gene, cell and tissue-engineered products; false: the
          rest.'
      - in: query
        name: authorised_after
        schema:
          type: string
          format: date
        description: Products first authorised on or after this date (YYYY-MM-DD,
          inclusive). This is the first approval, not the latest EC decision. Invalid
          dates return 400.
      - in: query
        name: authorised_before
        schema:
          type: string
          format: date
        description: Products first authorised on or before this date (YYYY-MM-DD,
          inclusive). Invalid dates return 400.
      - in: query
        name: category_id
        schema:
          type: array
          items:
            type: number
        description: 'Filter by category ID (see /categories/). One ID, or a comma-separated
          list that matches ANY of them, e.g. ?category_id=6,21. Only live links count:
          a link an editor removed never matches.'
        explode: false
        style: form
      - in: query
        name: category_slug
        schema:
          type: string
        description: Filter by category slug (see /categories/). Only live links count.
      - in: query
        name: include_generics
        schema:
          type: boolean
        description: 'Generic and biosimilar products, and duplicate products (further
          EMA products for the same medicine, grouped under a lead product: see `grouped_under`),
          are left out unless this is true. They are matched and stored like any other
          product; the default hides them so a list shows the originators.'
      - in: query
        name: include_public
        schema:
          type: boolean
        description: |-
          Identified callers only (API key or signed-in user): add the scopes of every publicly readable site to your own, so a private site's frontend can read public content alongside its own. No-op for an anonymous caller, whose scope already is exactly that set.

          Undeclared but functional before Phase 4 of site-scoped API visibility, when it read 'adds public organisations' — organisations are no longer the visibility unit, so it is declared here with its current meaning rather than left to be discovered.
      - in: query
        name: is_combination
        schema:
          type: boolean
        description: 'true: products with more than one substance; false: single-substance
          products.'
      - in: query
        name: name
        schema:
          type: string
        description: 'Part of the product''s name as EMA publishes it (the brand name),
          case-insensitive, e.g. ?name=ocrevus. A substring of the whole name, which
          can include a former name: ?name=corbilta finds "Corbilta (previously Levodopa/Carbidopa/Entacapone
          Sandoz)". Use `substance` for the active substance.'
      - in: query
        name: opinion_status
        schema:
          type: string
        description: Positive or Negative. EMA fills it only while a medicine is at
          the opinion stage and clears it once the Commission decides, so most products
          have none.
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - authorisation_date
            - -authorisation_date
            - latest_ec_decision_date
            - -latest_ec_decision_date
            - ema_last_updated
            - -ema_last_updated
        description: Sort field, prefix with `-` for descending (default `-ema_last_updated`).
          Products without the date always sort last, in both directions. Ties break
          on `-id`. `latest_ec_decision_date` is the latest Commission decision, not
          the approval; sort on `authorisation_date` for that. Accepts a comma-separated
          combination of the values above to break ties on a second field, e.g. ?ordering=authorisation_date,-latest_ec_decision_date.
        explode: false
        style: form
      - in: query
        name: orphan_medicine
        schema:
          type: boolean
        description: 'true: designated orphan medicines; false: the rest.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: site_id
        schema:
          type: number
        description: 'Filter by Django Site ID: keep medicines linked to a category
          that has a subject in that site''s scope (see CustomSetting.scope_subjects),
          or approved by EMA for one of those subjects. Given together with category_id
          or category_slug, only category links count. A site that does not show medicines
          (medicines_enabled off) returns nothing. Only live links count.'
      - in: query
        name: status
        schema:
          type: string
        description: EMA's status wording, case-insensitive, e.g. Authorised, Withdrawn,
          Refused, Opinion. EMA's own words are stored, so new values can appear.
      - in: query
        name: subject_id
        schema:
          type: number
        description: 'Keep medicines for this subject (see /subjects/): linked to
          a category that has it, or approved by EMA for one of its conditions (a
          subject link). Only live links count. Given together with category_id or
          category_slug, only category links count, and all the filters must hold
          on the same link: ?subject_id=1&category_id=6 means a live link to category
          6, and category 6 has subject 1.'
      - in: query
        name: substance
        schema:
          type: string
        description: A substance, as EMA names it (the INN, or the active substance
          when the INN is empty). Matches one element of the product's `substances`
          exactly, ignoring case and extra spaces, e.g. ?substance=ocrelizumab. A
          combination product matches on any of its substances.
      - in: query
        name: tracked
        schema:
          type: boolean
        description: 'false: no live link to a category you can see (the medicine
          shows only because EMA approved it for one of the site''s conditions); true:
          filed under at least one category you can see. Exactly `categories` empty
          or not on each row.'
      tags:
      - medicines
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMedicineList'
          description: ''
