          type: array
          items:
            type: string
            maxLength: 40
        applicants:
          type: array
          items:
            $ref: '#/components/schemas/PatentApplicant'
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/TeamCategory'
          readOnly: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subjects'
          readOnly: true
        publications_count:
          type: integer
          readOnly: true
        trial_links_count:
          type: integer
          readOnly: true
        editorial:
          type: array
          items:
            $ref: '#/components/schemas/EditorialSiteEntry'
          readOnly: true
      required:
      - applicants
      - categories
      - editorial
      - patent_id
      - publications_count
      - subjects
