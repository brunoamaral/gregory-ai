  /authors/:
    get:
      operationId: authors_list
      description: |-
        Enhanced Authors API with sorting and filtering capabilities.

        # Query Parameters:

        - **author_id** - filter by specific author ID
        - **full_name** - search by author's full name (case-insensitive)
        - **given_name** - search by author's given name (case-insensitive)
        - **family_name** - search by author's family name (case-insensitive)
        - **orcid** - filter by ORCID identifier (case-insensitive contains search)
        - **country** - filter by country code (exact match)
        - **sort_by** - 'article_count' (default: 'author_id')
        - **order** - 'asc' or 'desc' (default: 'desc' for article_count, 'asc' for others)
        - **team_id** - filter by team ID
        - **subject_id** - filter by subject ID
        - **category_slug** - filter by team category slug
        - **category_id** - filter by team category ID
        - **date_from** - filter articles from this date (YYYY-MM-DD)
        - **date_to** - filter articles to this date (YYYY-MM-DD)
        - **timeframe** - 'year', 'month', 'week' (relative to current date)

        # Examples:

        - Get specific author: `?author_id=380002`
        - Search by name: `?full_name=John%20Smith`
        - Search by given name: `?given_name=John`
        - Search by family name: `?family_name=Smith`
        - Filter by ORCID: `?orcid=0000-0000-0000-0001`
        - Filter by country: `?country=US`
        - Sort by article count: `?sort_by=article_count&order=desc`
        - Filter by timeframe: `?sort_by=article_count&timeframe=year`
        - Team and subject filter: `?team_id=1&subject_id=5&sort_by=article_count`
        - Count per category: `?team_id=1&category_slug=natalizumab&sort_by=article_count&order=desc`
        - Category with ID: `?team_id=1&category_id=5&sort_by=article_count&order=desc`
        - Category with timeframe: `?team_id=1&category_slug=natalizumab&timeframe=year&sort_by=article_count`
        - Date range: `?date_from=2024-06-01&date_to=2024-12-31&team_id=1&subject_id=1&sort_by=article_count`

        # Pagination:
        Standard `page`/`page_size` pagination (`count`/`next`/`previous`/`results`
        envelope). Requests past offset 10,000 (`page * page_size`) return `400` —
        see HOUSE-LOAD-SPIKE-P2-QUERY-COST.md item 1. There is no `all_results`
        bypass on this endpoint; for a bulk/team-scoped read use
        `GET /authors/search/` instead, which supports `all_results=true`.
      parameters:
      - in: query
        name: author_id
        schema:
          type: integer
        description: Filter by a specific author ID.
      - in: query
        name: category_id
        schema:
          type: integer
        description: Restrict to authors with at least one article in this team category
          (by ID, see /categories/). Requires team_id.
      - in: query
        name: category_slug
        schema:
          type: string
        description: Restrict to authors with at least one article in this team category
          (by slug, see /categories/). Requires team_id.
      - in: query
        name: country
        schema:
          type: string
        description: Exact match against the author's country code.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Only count articles published on or after this date (YYYY-MM-DD)
          toward team_id/subject_id/category filtering and article_count.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Only count articles published on or before this date (YYYY-MM-DD)
          toward team_id/subject_id/category filtering and article_count.
      - in: query
        name: family_name
        schema:
          type: string
        description: Case-insensitive substring match against the family (last) name.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - in: query
        name: full_name
        schema:
          type: string
        description: Case-insensitive substring match against the author's full name.
      - in: query
        name: given_name
        schema:
          type: string
        description: Case-insensitive substring match against the given (first) name.
      - in: query
        name: orcid
        schema:
          type: string
        description: Case-insensitive substring match against the author's ORCID iD.
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: 'Sort direction (default: desc when sort_by=article_count, asc
          otherwise).'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sort_by
        schema:
          type: string
          enum:
          - article_count
          - author_id
          - country
          - full_name
        description: 'Sort field (default: author_id); an unrecognised value falls
          back to author_id. This endpoint does not use the standard `ordering` param.'
      - in: query
        name: subject_id
        schema:
          type: integer
        description: Restrict to authors with at least one article in this subject.
          Requires team_id.
      - in: query
        name: team_id
        schema:
          type: integer
        description: Restrict to authors with at least one article on this team. Required
          if subject_id, category_slug, or category_id is given — without it, the
          response is an empty page rather than an error.
      - in: query
        name: timeframe
        schema:
          type: string
          enum:
          - month
          - week
          - year
        description: Shortcut for date_from relative to now (overridden by an explicit
          date_from); has no effect on date_to.
      tags:
      - authors
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthorList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedAuthorList'
          description: ''
