openapi: 3.0.3
info:
  title: GregoryAI API
  version: 1.0.0
  description: 'REST API for GregoryAI: articles, clinical trials, authors, sources,
    subjects, categories, sponsors and teams. See docs/03-api-and-rss-feeds.md for
    prose documentation and authentication details.'
paths:
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
            text/csv:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /articles/:
    get:
      operationId: articles_list
      description: |-
        List all articles in the database with comprehensive filtering options.
        CSV responses are automatically streamed for better performance with large datasets.

        # Query Parameters:
        - **team_id** - filter by team ID
        - **site_id** - filter by Django Site ID; returns articles carrying a subject in that site's scope (see CustomSetting.scope_subjects)
        - **doi** - filter by DOI, case-insensitive; accepts a single value or a comma-separated list (e.g. `?doi=10.1/a,10.2/b`)
        - **subject_id** - filter by subject ID (used with team_id)
        - **subjects** - comma-separated list of subject IDs with AND semantics — returns only articles tagged with *all* listed subjects (e.g., `?subjects=1,2`)
        - **subjects_any** - comma-separated list of subject IDs with OR semantics — returns articles tagged with *any* of the listed subjects (e.g., `?subjects_any=1,2`)
        - **author_id** - filter by author ID
        - **category_slug** - filter by category slug
        - **category_id** - filter by category ID
        - **journal_slug** - filter by journal (convert spaces to dashes)
        - **source_id** - filter by source ID
        - **category_modality** - filter by the intervention modality of the article's categories; one of the `CategoryModality` values
        - **has_clinical_trials** - filter for articles linked to one or more clinical trials (true/false)
        - **has_takeaways** - true/false: whether the caller's own site has written takeaways for the article
        - **include** - `editorial` adds an `editorial` list (one entry per site the caller may read, each with its `takeaways` and `summary_plain_english`); JSON only
        - **search** - search in title and summary (supports boolean operators, e.g. `a OR b`)
        - **title** - search only in the title field (case-insensitive substring)
        - **summary** - search only in the summary/abstract field (case-insensitive substring)
        - **ordering** - sort field, prefix with `-` for descending. Allowed values: `discovery_date`, `published_date`, `title`, `article_id`, `ml_score`. Articles without a score always appear last when ordering by `ml_score`.
        - **page** - page number for pagination
        - **page_size** - items per page (max 100)
        - **all_results** - set to 'true' to bypass pagination and get all results (useful for CSV export)

        # Special Article Types:
        - **relevant** - filter for relevant articles (true/false). When combined with **subject_id**, relevance is scoped to that specific subject — only articles that are relevant *for that subject* (via ML predictions or manual marking) are returned. Without subject_id, relevance is checked across all subjects.
        - **ml_threshold** - the consensus rule behind `relevant=true`, with a custom confidence (float 0.0-1.0, e.g., 0.9). An article matches when enough models (per its subject's ML consensus setting: any, majority or all) classed it relevant with at least this probability. A model classes an article relevant only at or above the cutoff its prediction run used (0.8 by default), so values below that cutoff return the same articles as the cutoff. Subjects with ML predictions turned off never match. Scoped to subject_id when provided; defaults to 0.8 when `relevant=true` and this is omitted. To filter on the displayed `ml_score` instead, use **ml_score_min**.
        - **ml_score_min** - only articles whose `ml_score` (the score shown on each article) is at least this value (float 0.0-1.0, inclusive). Articles without an `ml_score` are left out. Applies no consensus rule and is not scoped by subject_id. Values outside 0.0-1.0 and non-numeric values return **400 Bad Request**.
        - **open_access** - filter for open access articles (true/false)
        - **last_days** - filter for articles from last N days (number)
        - **week** - filter for specific week number (requires year parameter)
        - **year** - year for week filtering (used with week parameter)

        # Date Range Parameters:
        Filter by publication date. Both parameters are optional and can be used independently or together.
        Invalid or non-ISO-8601 dates return **400 Bad Request**.
        - **published_date_after** - articles published on or after this date (YYYY-MM-DD, inclusive)
        - **published_date_before** - articles published on or before this date (YYYY-MM-DD, inclusive — the full day is included)

        # Stats Endpoint:
        `GET /articles/stats/` returns aggregate counts over the filtered queryset: `total`
        (distinct articles), `by_access` (`{open, restricted, unknown}` — articles without an
        access value are folded into `unknown`), `relevant`, `retracted`, `missing_doi`, and a
        `by_subject` breakdown (`[{subject_id, subject_name, count}]`, distinct per article,
        restricted to subjects visible to the caller). It accepts the same query parameters as
        the list endpoint, so e.g. `/articles/stats/?team_id=1&relevant=true` scopes the counts
        exactly like the equivalent list request. The `relevant` count uses the same semantics
        as the list's `?relevant=true` filter: when `subject_id` is present it counts articles
        relevant *for that subject* (manual review or ML consensus, honoring `ml_threshold`),
        not articles merely relevant for some other subject. Results are cached server-side for
        STATS_CACHE_TTL seconds (default 600).

        # Response Fields:
        Each article includes **pmid**, **pmcid**, **keywords**, **publication_types** and **mesh** when PubMed
        has a record for it (empty or `null` otherwise). Filter on PubMed ID with `?pmid=`.

        Each article includes a **ml_score** field: the average ML probability score across the most recent
        prediction per (algorithm, subject) pair. `null` when no predictions exist yet. Because it averages
        every subject the article was scored for, it is not scoped by `subject_id`.

        # Examples:
        - By DOI (single): `/articles/?doi=10.1016/j.procs.2023.01.401`
        - By DOI (multiple): `/articles/?doi=10.1016/j.procs.2023.01.401,10.1016/j.other.2024.02.001`
        - Team articles: `/articles/?team_id=1`
        - Team + subject: `/articles/?team_id=1&subject_id=4`
        - Multi-subject AND: `/articles/?subjects=1,2`
        - Multi-subject OR: `/articles/?subjects_any=1,2`
        - With search: `/articles/?team_id=1&search=stem+cells`
        - Category by slug: `/articles/?team_id=1&category_slug=natalizumab`
        - Category by ID: `/articles/?team_id=1&category_id=5`
        - Relevant articles: `/articles/?relevant=true`
        - Relevant with ML threshold: `/articles/?relevant=true&ml_threshold=0.9`
        - Top-scored for a subject: `/articles/?subject_id=1&ml_score_min=0.7&ordering=-ml_score`
        - Relevant from last 15 days: `/articles/?relevant=true&last_days=15`
        - Relevant from specific week: `/articles/?relevant=true&week=52&year=2024`
        - Open access articles: `/articles/?open_access=true`
        - Published in 2023: `/articles/?published_date_after=2023-01-01&published_date_before=2023-12-31`
        - Published since a date: `/articles/?published_date_after=2024-01-01`
        - Date range + subject + CSV: `/articles/?team_id=1&subjects=1,3&published_date_after=2022-06-01&published_date_before=2023-12-31&format=csv&all_results=true`
        - CSV export all results: `/articles/?format=csv&all_results=true`
        - Sort by AI relevance: `/articles/?ordering=-ml_score`
        - Relevant + AI relevance sort: `/articles/?relevant=true&ordering=-ml_score`
        - Complex filter: `/articles/?team_id=1&subject_id=4&author_id=123&search=regeneration&relevant=true&ml_threshold=0.8&ordering=-ml_score`
      parameters:
      - in: query
        name: author_id
        schema:
          type: integer
        description: Filter by author ID (see /authors/).
      - in: query
        name: category_id
        schema:
          type: integer
        description: Filter by category ID (see /categories/).
      - in: query
        name: category_modality
        schema:
          type: string
          nullable: true
          enum:
          - biologic_antibody
          - cell_gene_therapy
          - device_neuromodulation
          - natural_product
          - other
          - rehabilitation
          - research_topic
          - small_molecule
        description: |-
          Filter by the intervention modality of the article's categories; one of the CategoryModality values.

          * `small_molecule` - Small-molecule drug
          * `biologic_antibody` - Antibody / biologic
          * `cell_gene_therapy` - Cell / gene therapy
          * `rehabilitation` - Rehabilitation / physical
          * `device_neuromodulation` - Device / neuromodulation
          * `natural_product` - Natural product / supplement
          * `research_topic` - Research topic (not an intervention)
          * `other` - Other
      - in: query
        name: category_slug
        schema:
          type: string
        description: Filter by category slug (see /categories/).
      - in: query
        name: doi
        schema:
          type: string
        description: Filter by DOI, case-insensitive. Accepts a single value or a
          comma-separated list, e.g. ?doi=10.1/a,10.2/b.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - in: query
        name: has_clinical_trials
        schema:
          type: boolean
        description: Filter for articles linked to one or more clinical trials (true/false).
          A link an editor removed does not count.
      - in: query
        name: has_takeaways
        schema:
          type: boolean
        description: 'true: records with non-empty takeaways written for the caller''s
          own site (API key''s site, the sites of the organisations of a logged-in
          user, or the resolved public site). false: everything else. Does not require
          include=editorial.'
      - in: query
        name: include
        schema:
          type: string
          enum:
          - editorial
        description: 'Opt in to extra content. Comma-separated; `editorial` is the
          value for this endpoint (`claims` is accepted but only patents use it),
          and it adds an `editorial` list of the caller''s own `takeaways` and `summary_plain_english`:
          one entry per site on articles, one per organisation on trials (see docs/03-api-and-rss-feeds.md).
          Unknown values return 400. Ignored for CSV output.'
      - in: query
        name: include_public
        schema:
          type: boolean
        description: |-
          Identified callers only (API key or signed-in user): add the scopes of every publicly readable site to your own, so a private site's frontend can read public content alongside its own. No-op for an anonymous caller, whose scope already is exactly that set.

          Undeclared but functional before Phase 4 of site-scoped API visibility, when it read 'adds public organisations' — organisations are no longer the visibility unit, so it is declared here with its current meaning rather than left to be discovered.
      - in: query
        name: journal_slug
        schema:
          type: string
        description: Filter by journal name (convert spaces to dashes), case-insensitive
          exact match.
      - in: query
        name: last_days
        schema:
          type: number
        description: Filter for articles discovered in the last N days.
      - in: query
        name: ml_score_min
        schema:
          type: number
          format: float
        description: 'Only articles whose ml_score (the score shown on each article)
          is at least this value. Articles without an ml_score are left out. Not scoped
          by subject_id: ml_score averages the latest prediction of every model for
          every subject the article was scored for. Unlike ml_threshold it applies
          no consensus rule.'
      - in: query
        name: ml_threshold
        schema:
          type: number
        description: 'The consensus rule behind relevant=true, with a custom confidence.
          An article matches when enough models (per its subject''s ML consensus setting:
          any, majority or all) classed it relevant with at least this probability.
          A model classes an article relevant only at or above the cutoff its prediction
          run used (0.8 by default), so values below that cutoff return the same articles
          as the cutoff. Subjects with ML predictions turned off never match. Scoped
          to subject_id/subjects/subjects_any when provided. Defaults to 0.8 when
          relevant=true and this is omitted. To filter on the displayed ml_score instead,
          use ml_score_min.'
      - in: query
        name: open_access
        schema:
          type: boolean
        description: Filter for open access articles (true/false).
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - discovery_date
            - -discovery_date
            - published_date
            - -published_date
            - title
            - -title
            - article_id
            - -article_id
            - ml_score
            - -ml_score
        description: Sort field, prefix with `-` for descending. Articles without
          an ml_score always sort last when ordering by ml_score, in both directions.
          Accepts a comma-separated combination of the values above to break ties
          on a second field, e.g. ?ordering=discovery_date,-published_date.
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pmid
        schema:
          type: string
        description: Filter by PubMed ID (digits only), exact match, e.g. ?pmid=38812345.
      - in: query
        name: published_date_after
        schema:
          type: string
          format: date
        description: Articles published on or after this date (YYYY-MM-DD, inclusive).
          Invalid or non-ISO-8601 dates return 400 Bad Request.
      - in: query
        name: published_date_before
        schema:
          type: string
          format: date
        description: Articles published on or before this date (YYYY-MM-DD, inclusive
          — the full day is included). Invalid or non-ISO-8601 dates return 400 Bad
          Request.
      - in: query
        name: relevant
        schema:
          type: boolean
        description: Filter for relevant articles (true/false). When combined with
          subject_id, subjects, and/or subjects_any, relevance is scoped to that subject
          or subjects — only articles relevant *for one of those subjects* (via ML
          predictions or manual marking) are returned. Without any of those, relevance
          is checked across every subject in the database, so a caller that also scopes
          the query by subject should always pass the same subject(s) here to avoid
          picking up relevance decided by an unrelated subject.
      - in: query
        name: search
        schema:
          type: string
        description: Boolean search across title and summary. Bare terms are AND-ed;
          uppercase OR/NOT and "quoted phrases" are supported, e.g. ?search=stem OR
          cells. Combines (AND) with title and summary.
      - in: query
        name: site_id
        schema:
          type: number
        description: Filter by Django Site ID; returns articles carrying a subject
          in that site's scope (see CustomSetting.scope_subjects).
      - in: query
        name: source_id
        schema:
          type: integer
        description: Filter by source ID (see /sources/).
      - in: query
        name: subject_id
        schema:
          type: integer
        description: Filter by subject ID (see /subjects/). Commonly combined with
          team_id.
      - in: query
        name: subjects
        schema:
          type: array
          items:
            type: integer
        description: Comma-separated list of subject IDs with AND semantics — returns
          only articles tagged with *all* listed subjects, e.g. ?subjects=1,2.
        explode: false
        style: form
      - in: query
        name: subjects_any
        schema:
          type: array
          items:
            type: string
        description: Comma-separated list of subject IDs with OR semantics — returns
          articles tagged with *any* of the listed subjects, e.g. ?subjects_any=1,2.
        explode: false
        style: form
      - in: query
        name: summary
        schema:
          type: string
        description: Case-insensitive substring match against the summary/abstract
          only.
      - in: query
        name: team_id
        schema:
          type: integer
        description: Filter by team ID.
      - in: query
        name: title
        schema:
          type: string
        description: Case-insensitive substring match against the title only.
      - in: query
        name: week
        schema:
          type: number
        description: Filter for a specific ISO week number; requires year to be set
          too.
      - in: query
        name: year
        schema:
          type: number
        description: Year to use together with the week parameter; has no effect on
          its own.
      tags:
      - articles
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedArticleList'
          description: ''
  /articles/{article_id}/:
    get:
      operationId: articles_retrieve
      description: |-
        List all articles in the database with comprehensive filtering options.
        CSV responses are automatically streamed for better performance with large datasets.

        # Query Parameters:
        - **team_id** - filter by team ID
        - **site_id** - filter by Django Site ID; returns articles carrying a subject in that site's scope (see CustomSetting.scope_subjects)
        - **doi** - filter by DOI, case-insensitive; accepts a single value or a comma-separated list (e.g. `?doi=10.1/a,10.2/b`)
        - **subject_id** - filter by subject ID (used with team_id)
        - **subjects** - comma-separated list of subject IDs with AND semantics — returns only articles tagged with *all* listed subjects (e.g., `?subjects=1,2`)
        - **subjects_any** - comma-separated list of subject IDs with OR semantics — returns articles tagged with *any* of the listed subjects (e.g., `?subjects_any=1,2`)
        - **author_id** - filter by author ID
        - **category_slug** - filter by category slug
        - **category_id** - filter by category ID
        - **journal_slug** - filter by journal (convert spaces to dashes)
        - **source_id** - filter by source ID
        - **category_modality** - filter by the intervention modality of the article's categories; one of the `CategoryModality` values
        - **has_clinical_trials** - filter for articles linked to one or more clinical trials (true/false)
        - **has_takeaways** - true/false: whether the caller's own site has written takeaways for the article
        - **include** - `editorial` adds an `editorial` list (one entry per site the caller may read, each with its `takeaways` and `summary_plain_english`); JSON only
        - **search** - search in title and summary (supports boolean operators, e.g. `a OR b`)
        - **title** - search only in the title field (case-insensitive substring)
        - **summary** - search only in the summary/abstract field (case-insensitive substring)
        - **ordering** - sort field, prefix with `-` for descending. Allowed values: `discovery_date`, `published_date`, `title`, `article_id`, `ml_score`. Articles without a score always appear last when ordering by `ml_score`.
        - **page** - page number for pagination
        - **page_size** - items per page (max 100)
        - **all_results** - set to 'true' to bypass pagination and get all results (useful for CSV export)

        # Special Article Types:
        - **relevant** - filter for relevant articles (true/false). When combined with **subject_id**, relevance is scoped to that specific subject — only articles that are relevant *for that subject* (via ML predictions or manual marking) are returned. Without subject_id, relevance is checked across all subjects.
        - **ml_threshold** - the consensus rule behind `relevant=true`, with a custom confidence (float 0.0-1.0, e.g., 0.9). An article matches when enough models (per its subject's ML consensus setting: any, majority or all) classed it relevant with at least this probability. A model classes an article relevant only at or above the cutoff its prediction run used (0.8 by default), so values below that cutoff return the same articles as the cutoff. Subjects with ML predictions turned off never match. Scoped to subject_id when provided; defaults to 0.8 when `relevant=true` and this is omitted. To filter on the displayed `ml_score` instead, use **ml_score_min**.
        - **ml_score_min** - only articles whose `ml_score` (the score shown on each article) is at least this value (float 0.0-1.0, inclusive). Articles without an `ml_score` are left out. Applies no consensus rule and is not scoped by subject_id. Values outside 0.0-1.0 and non-numeric values return **400 Bad Request**.
        - **open_access** - filter for open access articles (true/false)
        - **last_days** - filter for articles from last N days (number)
        - **week** - filter for specific week number (requires year parameter)
        - **year** - year for week filtering (used with week parameter)

        # Date Range Parameters:
        Filter by publication date. Both parameters are optional and can be used independently or together.
        Invalid or non-ISO-8601 dates return **400 Bad Request**.
        - **published_date_after** - articles published on or after this date (YYYY-MM-DD, inclusive)
        - **published_date_before** - articles published on or before this date (YYYY-MM-DD, inclusive — the full day is included)

        # Stats Endpoint:
        `GET /articles/stats/` returns aggregate counts over the filtered queryset: `total`
        (distinct articles), `by_access` (`{open, restricted, unknown}` — articles without an
        access value are folded into `unknown`), `relevant`, `retracted`, `missing_doi`, and a
        `by_subject` breakdown (`[{subject_id, subject_name, count}]`, distinct per article,
        restricted to subjects visible to the caller). It accepts the same query parameters as
        the list endpoint, so e.g. `/articles/stats/?team_id=1&relevant=true` scopes the counts
        exactly like the equivalent list request. The `relevant` count uses the same semantics
        as the list's `?relevant=true` filter: when `subject_id` is present it counts articles
        relevant *for that subject* (manual review or ML consensus, honoring `ml_threshold`),
        not articles merely relevant for some other subject. Results are cached server-side for
        STATS_CACHE_TTL seconds (default 600).

        # Response Fields:
        Each article includes **pmid**, **pmcid**, **keywords**, **publication_types** and **mesh** when PubMed
        has a record for it (empty or `null` otherwise). Filter on PubMed ID with `?pmid=`.

        Each article includes a **ml_score** field: the average ML probability score across the most recent
        prediction per (algorithm, subject) pair. `null` when no predictions exist yet. Because it averages
        every subject the article was scored for, it is not scoped by `subject_id`.

        # Examples:
        - By DOI (single): `/articles/?doi=10.1016/j.procs.2023.01.401`
        - By DOI (multiple): `/articles/?doi=10.1016/j.procs.2023.01.401,10.1016/j.other.2024.02.001`
        - Team articles: `/articles/?team_id=1`
        - Team + subject: `/articles/?team_id=1&subject_id=4`
        - Multi-subject AND: `/articles/?subjects=1,2`
        - Multi-subject OR: `/articles/?subjects_any=1,2`
        - With search: `/articles/?team_id=1&search=stem+cells`
        - Category by slug: `/articles/?team_id=1&category_slug=natalizumab`
        - Category by ID: `/articles/?team_id=1&category_id=5`
        - Relevant articles: `/articles/?relevant=true`
        - Relevant with ML threshold: `/articles/?relevant=true&ml_threshold=0.9`
        - Top-scored for a subject: `/articles/?subject_id=1&ml_score_min=0.7&ordering=-ml_score`
        - Relevant from last 15 days: `/articles/?relevant=true&last_days=15`
        - Relevant from specific week: `/articles/?relevant=true&week=52&year=2024`
        - Open access articles: `/articles/?open_access=true`
        - Published in 2023: `/articles/?published_date_after=2023-01-01&published_date_before=2023-12-31`
        - Published since a date: `/articles/?published_date_after=2024-01-01`
        - Date range + subject + CSV: `/articles/?team_id=1&subjects=1,3&published_date_after=2022-06-01&published_date_before=2023-12-31&format=csv&all_results=true`
        - CSV export all results: `/articles/?format=csv&all_results=true`
        - Sort by AI relevance: `/articles/?ordering=-ml_score`
        - Relevant + AI relevance sort: `/articles/?relevant=true&ordering=-ml_score`
        - Complex filter: `/articles/?team_id=1&subject_id=4&author_id=123&search=regeneration&relevant=true&ml_threshold=0.8&ordering=-ml_score`
      parameters:
      - in: path
        name: article_id
        schema:
          type: integer
        description: A unique integer value identifying this articles.
        required: true
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - in: query
        name: include
        schema:
          type: string
          enum:
          - editorial
        description: 'Opt in to extra content. Comma-separated; `editorial` is the
          value for this endpoint (`claims` is accepted but only patents use it),
          and it adds an `editorial` list of the caller''s own `takeaways` and `summary_plain_english`:
          one entry per site on articles, one per organisation on trials (see docs/03-api-and-rss-feeds.md).
          Unknown values return 400. Ignored for CSV output.'
      tags:
      - articles
      security:
      - {}
      - basicAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
            text/csv:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
  /articles/edit/:
    post:
      operationId: articles_edit_create
      description: Edit editorial and metadata fields on an existing article. Lookup
        is by `doi` (required). Raises 404 if not found, 409 if the DOI matches multiple
        articles (data quality issue), and 403 if the article is not associated with
