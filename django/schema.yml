            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        earliest_priority_date:
          type: string
          format: date
          nullable: true
        earliest_publication_date:
          type: string
          format: date
          nullable: true
        has_grant:
          type: boolean
