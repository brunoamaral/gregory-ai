<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>{% block title %}Sign in{% endblock %} - GregoryAI</title>
	<style>
		:root {
			--bg: #f5f6f8;
			--card: #ffffff;
			--text: #1b1f24;
			--muted: #5b6573;
			--line: #dde1e7;
			--accent: #1f5fbf;
			--accent-text: #ffffff;
			--danger: #a3262a;
			--danger-bg: #fdecec;
			--note-bg: #eef3fb;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #14171b;
				--card: #1d2127;
				--text: #e8eaed;
				--muted: #a2abb8;
				--line: #2f353d;
				--accent: #6ea2f0;
				--accent-text: #0c1117;
				--danger: #f08b8e;
				--danger-bg: #3a1f21;
				--note-bg: #1f2a3a;
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px 16px;
			background: var(--bg);
			color: var(--text);
			font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		main {
			width: 100%;
			max-width: 440px;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: 28px 24px;
		}
		h1 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 8px; }
		p { margin: 0 0 14px; }
		.muted { color: var(--muted); font-size: 0.9rem; }
		label { display: block; font-weight: 600; margin: 14px 0 4px; }
		input[type=text], input[type=password] {
			width: 100%;
			padding: 10px 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--bg);
			color: var(--text);
			font: inherit;
		}
		input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
		.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
		button, .button {
			flex: 1 1 140px;
			padding: 11px 16px;
			border-radius: 8px;
			border: 1px solid var(--line);
			background: transparent;
			color: var(--text);
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
		button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
		.error { background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
		.note { background: var(--note-bg); border-radius: 8px; padding: 10px 12px; margin: 14px 0; }
		ul.can { margin: 8px 0 14px; padding-left: 20px; }
		ul.can li { margin: 4px 0; }
		dl { margin: 14px 0; font-size: 0.9rem; }
		dt { color: var(--muted); }
		dd { margin: 0 0 8px; word-break: break-word; }
	</style>
</head>
<body>
	<main>
		{% block content %}{% endblock %}
	</main>
</body>
</html>
