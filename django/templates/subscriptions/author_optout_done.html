<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opted Out</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f9fafb;
            margin: 0;
            padding: 40px 16px;
            color: #111827;
        }
        .card {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
            padding: 40px 36px;
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin-top: 0; }
        p  { line-height: 1.6; color: #4b5563; }
    </style>
</head>
<body>
<div class="card">
    <h1>You have been opted out</h1>

    <p>{{ outreach.email }} will not receive this kind of one-time outreach email again,
    from any GregoryAI site.</p>

    <p style="font-size: 0.85rem; color: #9ca3af; margin-top: 24px;">
        Your author profile page is unaffected and remains published as-is.
    </p>
</div>
</body>
</html>
