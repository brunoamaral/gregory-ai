name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Reuse the published image: it already has the heavy deps (torch,
    # tensorflow, transformers) installed, so CI doesn't reinstall them.
    container:
      image: amaralbruno/gregory-ai:latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gregory_test
          POSTGRES_USER: postgres
          # Throwaway CI database reachable only on the job network; trust auth
          # avoids hardcoding a password (which secret scanners flag).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: gregory_test
      POSTGRES_USER: postgres
      DB_HOST: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('django/requirements.txt') }}
          restore-keys: pip-

      - name: Install/update Python dependencies
        working-directory: django
        run: pip install --quiet -r requirements.txt

      - name: Generate ephemeral keys
        # Generated per-run so no secrets live in the repo; they only need to
        # be valid for the CI process. Exported to $GITHUB_ENV so every
        # subsequent step in this job shares them.
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          echo "FERNET_SECRET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Run pytest
        working-directory: django
        run: pytest -p no:cacheprovider

      - name: Migrations apply to an empty database
        working-directory: django
        # pytest runs with --nomigrations (pytest.ini), so it builds the test
        # schema straight from model state and never applies a migration. Neither
        # does `makemigrations --check`, which only compares model state to
        # migration state. Without this step a migration that works solely against
        # an already-migrated database ships green — as gregory/0095 did, colliding
        # with an index gregory/0073 left orphaned on any build from scratch.
        # Targets the empty `gregory_test` service database; pytest uses the
        # `test_`-prefixed one, so the two never collide in either order.
        run: python manage.py migrate

      - name: Django system checks (database-aware)
        working-directory: django
        # `manage.py check` alone skips database-dependent model checks, which
        # is how models.E034 reached production on 2026-07-30 — an index name
        # over Django's 30-character limit. The flag is what makes those checks
        # run. No database connection is required, only a configured one.
        run: python manage.py check --database default

      - name: No missing migrations
        working-directory: django
        # Fails if a model changed without a matching migration, which would
        # drift the production schema from model state.
        run: python manage.py makemigrations --check --dry-run

      - name: Schema is current
        working-directory: django
        # test_openapi_schema.py only checks that generation succeeds with no
        # warnings — it never compares against the committed file. So nothing
        # else verifies django/schema.yml still matches the code that produced
        # it. mcp-server validates its tools against that committed file, and
        # django-filter silently ignores unknown query params — so a stale
        # schema means the MCP server can send a parameter the API no longer
        # accepts and get a plausible-looking, wrongly-filtered result with no
        # error anywhere. Regenerate, then fail if the file changed.
        run: |
          # Two failure modes, reported separately because the fixes differ.
          #
          # 1. NOT TRACKED. `git diff` only reports tracked paths, so if a PR
          #    deletes schema.yml the generator below recreates it untracked,
          #    `git diff --exit-code` sees nothing and exits 0 — and the
          #    mcp-tests contract fixture skips when the file is absent. The
          #    workflow would go green with no committed schema at all.
          # 2. DRIFTED. The committed file no longer matches the code.
          #
          # stderr is deliberately NOT suppressed: a git failure here (dubious
          # ownership in the container, a shallow checkout) must be visible
          # rather than misreported as "not tracked".
          echo "git $(git --version), drf-spectacular $(python -c 'import drf_spectacular; print(drf_spectacular.__version__)' 2>/dev/null || echo '?')"
          if ! git ls-files --error-unmatch schema.yml; then
            echo "::error::django/schema.yml is not tracked by git, or git could not read the index (see above)."
            echo "If the file was deleted: regenerate and 'git add' it — mcp-server validates its tools"
            echo "against this file, and its contract test skips silently when it is missing, so an"
            echo "untracked schema disables that check rather than failing it."
            exit 1
          fi
          python manage.py spectacular --file schema.yml --fail-on-warn
          if ! git diff --exit-code --stat schema.yml; then
            echo "::error::django/schema.yml is out of date — regenerated output differs from the committed file."
            echo "Fix: cd django && python manage.py spectacular --file schema.yml --fail-on-warn, then commit schema.yml."
            echo "Why: mcp-server validates its tools against this file, and django-filter ignores unknown"
            echo "query params silently — a stale schema means wrong results with no error."
            echo "--- first 60 lines of the difference ---"
            git --no-pager diff -- schema.yml | head -60
            exit 1
          fi

  # MCP server suite. Runs on a bare runner rather than inside the gregory-ai
  # image: it needs only `mcp` + `httpx2` + pytest, so pulling the multi-GB ML
  # image to run it would cost more than the tests themselves.
  #
  # This job gates the Docker build for BOTH images (build-push.yaml keys off
  # this whole workflow's conclusion). That is deliberate: the MCP server
  # encodes filter names lifted from django/schema.yml, and django-filter
  # silently ignores unknown query params — so an API change that outruns the
  # MCP server produces wrong results with no error. test_schema_contract.py
  # is what catches that, and it is only worth anything if it runs here.
  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      - name: Install mcp-server + dev deps
        working-directory: mcp-server
        run: pip install --quiet -e ".[dev]"

      - name: Run pytest
        working-directory: mcp-server
        # test_schema_contract.py reads ../django/schema.yml from the checkout,
        # so no Django runtime or database is needed here.
        run: pytest -p no:cacheprovider

  # Static gate for "hollow" error handling: bare `except:` and `except: pass`
  # (the empty catch block). Runs on a bare runner — no ML image needed — so it
  # finishes in seconds, in parallel with the test suite. Config: ruff.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Ruff — empty-catch gate (E722/S110/S112)
        # Version pinned so CI and local `uvx ruff` never drift. Config: ruff.toml.
        run: uvx ruff@0.16.00 check django/
